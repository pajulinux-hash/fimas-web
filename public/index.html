      try { const doc = await htmlToPdf(buildOfferHTML(of, { logo: true, images: await offerImagesAsData(of.items) })); attachments = [{ filename: 'Nabidka-' + o.number + '.pdf', contentBase64: doc.output('datauristring').split(',')[1] }]; }
      catch(e) { console.warn('[ADR E-shop] PDF příloha se nevytvořila', e); }
      const resp = await fetch(EMAIL_FUNCTION_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ type: 'offer', orderNumber: o.number, subject: 'Cenová nabídka ' + o.number + ' – ' + COMPANY.name, html, customerHtml, customerEmail: to, customerName: o.customer.name || '', attachments }) });
      let r = {}; try { r = await resp.json(); } catch {}
      if(!resp.ok || !r.success) throw new Error(r.error || ('HTTP ' + resp.status));
      const extra = { sentAt: new Date().toISOString(), sentTo: to, status: ['accepted', 'ordered'].includes(o.status) ? o.status : 'sent' };
      await save(extra, true);
      setMsg({ text: 'Nabídka odeslána na ' + to + (attachments.length ? ' (s PDF v příloze).' : ' (bez PDF přílohy – nepodařilo se ji vytvořit).') });
      showToast('Nabídka odeslána');
    } catch(e) { setMsg({ err: true, text: 'Odeslání se nepodařilo: ' + (e.message || e) }); }
    setBusy('');
  };
  const toOrder = async () => {
    const v = validate(true); if(v) { setMsg({ err: true, text: v }); return; }
    if(o.status === 'ordered' && !window.confirm('Z této nabídky už byla vytvořena objednávka ' + (o.orderId || '') + '. Vytvořit další?')) return;
    if(cart.length && !window.confirm('Košík obsahuje ' + cart.length + ' položek. Nahradit je položkami nabídky?')) return;
    if(!(await save(o.status === 'draft' || o.status === 'sent' ? { status: 'accepted' } : null, true))) return;
    const c = o.customer;
    const note = 'Dle nabídky ' + o.number + ' ze dne ' + czDate(o.date) + (o.axle ? ', náprava ' + String(o.axle).trim().toUpperCase() : '') + '.';
    setCart(o.items.map(i => ({ id: i.custom ? i.id : i.id, code: i.code || '', name: i.name, subtitle: i.subtitle || '', price: Math.max(0, Math.round(Number(i.price) || 0)), image: i.image || '', url: i.url || '', qty: offInt(i.qty), fixedPrice: true, offerNo: o.number })));
    try { sessionStorage.setItem(OFFER_CHECKOUT_KEY, JSON.stringify({ offerId: o.number, form: { name: c.name || '', email: c.email || '', phone: c.phone || '', company: c.company || '', ico: c.ico || '', dic: c.dic || '', street: c.street || '', city: c.city || '', zip: c.zip || '', note } })); } catch {}
    showToast('Položky nabídky jsou v košíku – doplňte adresu a odešlete objednávku');
    setPage('checkout');
  };
  const del = async () => {
    if(isNew) { onClose(false); return; }
    if(!window.confirm('Opravdu trvale smazat nabídku ' + o.number + '? Tuto akci nelze vrátit.')) return;
    const f = getFb();
    try { await f.db.collection('offers').doc(o.number).delete(); showToast('Nabídka smazána'); onClose(true); }
    catch(e) { setMsg({ err: true, text: 'Smazání se nepodařilo: ' + fbErr(e) }); }
  };
  const back = () => { if(dirty && !window.confirm('Máte neuložené změny. Opravdu odejít bez uložení?')) return; onClose(changed); };
  const field = (label, k, type, ph) => (
    <label className="offer-field"><span>{label}</span><input className="offer-in" type={type || 'text'} placeholder={ph || ''} value={o.customer[k] || ''} onChange={e => updC(k, e.target.value)}/></label>
  );
  const s = OFFER_STATUSES[o.status] || OFFER_STATUSES.draft;
  const SuggList = ({ title, list }) => !list.length ? null : (
    <div style={{marginTop:8}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:8,flexWrap:'wrap'}}>
        <strong style={{fontSize:13}}>{title} ({list.length})</strong>
        <button className="page-btn" onClick={() => list.forEach(addProduct)}>+ Přidat vše</button>
      </div>
      {list.map(p => <OfferProductRow key={p.id} p={p} inOffer={o.items.some(i => i.id === p.id)} onAdd={() => addProduct(p)}/>)}
    </div>);

  return (
    <div className="offer-editor">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8,marginBottom:12}}>
        <button className="page-btn" onClick={back}>← Zpět na seznam</button>
        <span className="offer-badge" style={{background:s.color}}>{s.label}{dirty ? ' · neuloženo' : ''}</span>
      </div>

      <div className="offer-card">
        <div className="offer-grid">
          <label className="offer-field"><span>Číslo nabídky</span><input className="offer-in" style={{fontWeight:700}} value={o.number} disabled={!isNew} onChange={e => upd({ number: e.target.value.trim().toUpperCase() })}/></label>
          <label className="offer-field"><span>Datum vytvoření</span><input className="offer-in" type="date" value={o.date} onChange={e => { const d = e.target.value; upd(isNew ? { date: d, number: nextOfferNumber(existingIds, d) } : { date: d }); }}/></label>
          <label className="offer-field"><span>Platnost do</span><input className="offer-in" value={czDate(offerValidUntil(o.date))} disabled/></label>
          <label className="offer-field"><span>Stav</span>
            <select className="offer-in" value={o.status} onChange={e => upd({ status: e.target.value })}>{Object.entries(OFFER_STATUSES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}</select></label>
        </div>
        {(o.sentAt || o.orderId) && <p style={{fontSize:12,color:'var(--text-muted)',margin:'8px 0 0'}}>
          {o.sentAt && <>Odesláno {new Date(o.sentAt).toLocaleString('cs-CZ')} na {o.sentTo}. </>}{o.orderId && <>Objednávka: <strong>{o.orderId}</strong>.</>}</p>}
      </div>

      <div className="offer-card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8,marginBottom:8}}>
          <h4 style={{margin:0}}>Zákazník</h4>
          {users.length > 0 && <select className="offer-in" style={{maxWidth:320}} value="" onChange={e => pickUser(e.target.value)}>
            <option value="">Vybrat registrovaného zákazníka…</option>
            {users.map(u => <option key={u._id} value={u._id}>{[u.company, u.name, u.email].filter(Boolean).join(' · ')}</option>)}
          </select>}
        </div>
        <div className="offer-grid">
          {field('Firma', 'company')}{field('Jméno a příjmení', 'name')}{field('Telefon', 'phone', 'tel')}{field('E-mail', 'email', 'email')}{field('IČO', 'ico')}
        </div>
        <a onClick={() => setShowAddr(v => !v)} style={{display:'inline-block',marginTop:8,fontSize:13,color:'var(--blue)',cursor:'pointer'}}>{showAddr ? '▾' : '▸'} Adresa a DIČ (nepovinné – hodí se pro převod do objednávky)</a>
        {showAddr && <div className="offer-grid" style={{marginTop:8}}>{field('Ulice a č. p.', 'street')}{field('Město', 'city')}{field('PSČ', 'zip')}{field('DIČ', 'dic')}</div>}
      </div>

      <div className="offer-card">
        <h4 style={{margin:'0 0 8px'}}>Číslo nápravy</h4>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          <input className="offer-in" style={{flex:'1 1 220px',fontFamily:'monospace',textTransform:'uppercase'}} placeholder="např. A70NA6INNO36" value={o.axle} onChange={e => upd({ axle: e.target.value })} onKeyDown={e => { if(e.key === 'Enter') suggest(); }}/>
          <button className="page-btn" onClick={suggest} disabled={!String(o.axle).trim()}>🔎 Navrhnout díly</button>
        </div>
        {sugg && sugg.error && <p style={{color:'var(--orange)',fontSize:13,margin:'8px 0 0'}}>{sugg.error}</p>}
        {sugg && !sugg.error && <div style={{marginTop:8}}>
          <p style={{fontSize:13,margin:'0 0 4px'}}>Typ nápravy <strong>{sugg.axle}</strong>{sugg.axleLabel ? ' – ' + sugg.axleLabel : ''}{sugg.brakeLabels.length ? <> · brzda: <strong>{sugg.brakeLabels.join(', ')}</strong></> : null}{sugg.holes ? <> · {sugg.holes} otvorů</> : null}</p>
          {!sugg.ready && <p style={{fontSize:12,color:'var(--text-muted)'}}>Data typů z e-shopu se ještě načítají…</p>}
          {sugg.ready && !sugg.axleParts.length && !sugg.brakeParts.length && <p style={{fontSize:13,color:'var(--text-muted)'}}>K této nápravě nejsou v e-shopu přiřazené díly – přidejte je vyhledáním níže.</p>}
          <div className="offer-sugg">
            <SuggList title="Díly nápravy" list={sugg.axleParts}/>
            <SuggList title="Díly brzdy" list={sugg.brakeParts}/>
          </div>
        </div>}
      </div>

      <div className="offer-card">
        <h4 style={{margin:'0 0 8px'}}>Položky nabídky</h4>
        <input className="offer-in" style={{width:'100%'}} placeholder="Hledat díl v e-shopu: název, kód, rozměr…" value={ps} onChange={e => setPs(e.target.value)}/>
        {nps.length >= 2 && <div className="offer-sugg" style={{marginTop:6}}>
          {results.length === 0 ? <p style={{fontSize:13,color:'var(--text-muted)',margin:'6px 0'}}>Nic nenalezeno.</p> :
            results.map(p => <OfferProductRow key={p.id} p={p} inOffer={o.items.some(i => i.id === p.id)} onAdd={() => addProduct(p)}/>)}
        </div>}
        <div className="table-scroll" style={{marginTop:12}}>
          <table className="offer-table offer-items">
            <thead><tr><th>#</th><th>Foto</th><th>Kód</th><th>Název</th><th style={{textAlign:'right'}}>Ks</th><th style={{textAlign:'right'}}>Cena/ks bez DPH</th><th style={{textAlign:'right'}}>Celkem bez DPH</th><th style={{textAlign:'right'}}>Celkem s DPH</th><th></th></tr></thead>
            <tbody>
              {o.items.length === 0 && <tr><td colSpan={9} style={{color:'var(--text-muted)',textAlign:'center',padding:16}}>Zatím žádné položky – vyhledejte díl, použijte „Navrhnout díly“ nebo přidejte vlastní položku.</td></tr>}
              {o.items.map((i, n) => (
                <tr key={i.id + '-' + n}>
                  <td>{n + 1}</td>
                  <td className="offer-thumb">{offerImgOk(i.image) ? <img src={i.image} alt="" loading="lazy" onError={e => { e.target.style.visibility = 'hidden'; }}/> : null}</td>
                  <td>{i.custom ? <input className="offer-in sm" style={{width:90}} value={i.code} onChange={e => updItem(n, { code: e.target.value })}/> : <span style={{fontFamily:'monospace',fontSize:12}}>{i.code}</span>}</td>
                  <td style={{minWidth:200}}>{i.custom ? <input className="offer-in sm" style={{width:'100%'}} placeholder="Název položky" value={i.name} onChange={e => updItem(n, { name: e.target.value })}/> : <><strong>{i.name}</strong>{i.subtitle && <div style={{fontSize:11,color:'var(--text-muted)'}}>{i.subtitle}</div>}</>}
                    {!i.custom && i.eshopPrice > 0 && Math.round(i.eshopPrice) !== Math.round(Number(i.price) || 0) && <div style={{fontSize:11,color:'var(--orange)'}}>cena v e-shopu {fmtPrice(Math.round(i.eshopPrice))}</div>}</td>
                  <td style={{textAlign:'right'}}><input className="offer-in sm" type="number" min="1" inputMode="numeric" style={{width:70,textAlign:'right'}} value={i.qty} onChange={e => updItem(n, { qty: e.target.value })}/></td>
                  <td style={{textAlign:'right'}}><input className="offer-in sm" type="number" min="0" step="1" inputMode="numeric" style={{width:100,textAlign:'right'}} value={i.price} onChange={e => updItem(n, { price: e.target.value })}/></td>
                  <td style={{textAlign:'right',whiteSpace:'nowrap',fontWeight:700}}>{fmtPrice(t.lines[n])}</td>
                  <td style={{textAlign:'right',whiteSpace:'nowrap'}}>{fmtPrice(withVat(t.lines[n]))}</td>
                  <td><button className="page-btn" title="Odebrat" onClick={() => removeItem(n)} style={{padding:'4px 10px'}}>✕</button></td>
                </tr>))}
            </tbody>
          </table>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12,marginTop:10}}>
          <button className="page-btn" onClick={addCustom}>+ Vlastní položka</button>
          <div style={{textAlign:'right',fontSize:14,lineHeight:1.7}}>
            <div>Celkem bez DPH: <strong>{fmtPrice(t.subtotal)}</strong></div>
            <div>DPH {Math.round(COMPANY.vatRate * 100)} %: <strong>{fmtPrice(t.vatTotal)}</strong></div>
            <div style={{fontSize:18}}>Celkem s DPH: <strong>{fmtPrice(t.total)}</strong></div>
            <div style={{fontSize:12,color:'var(--orange)',fontWeight:600}}>⚠ Bez poštovného a balného</div>
          </div>
        </div>
      </div>

      <div className="offer-card">
        <h4 style={{margin:'0 0 8px'}}>Poznámka <span style={{fontWeight:400,fontSize:12,color:'var(--text-muted)'}}>(tiskne se na nabídku)</span></h4>
        <textarea className="offer-in" rows={4} style={{width:'100%',resize:'vertical'}} value={o.notes} onChange={e => upd({ notes: e.target.value })} placeholder="Dodatečné informace pro zákazníka – termín dodání, alternativy, podmínky…"/>
      </div>

      {msg && <p style={{color: msg.err ? 'var(--red)' : 'var(--green)', fontWeight:600}}>{msg.text}</p>}
      <div className="offer-actions">
        <button className="auth-btn" disabled={!!busy} onClick={() => save()}>💾 Uložit</button>
        <button className="page-btn" disabled={!!busy} onClick={send} style={{background:'var(--blue)',color:'#fff'}}>{busy === 'send' ? 'Odesílám…' : '✉ Odeslat zákazníkovi'}</button>
        <button className="page-btn" disabled={!!busy} onClick={print}>🖨️ Tisk</button>
        <button className="page-btn" disabled={!!busy} onClick={pdf} style={{background:'var(--red)',color:'#fff'}}>{busy === 'pdf' ? 'Vytvářím…' : '📄 PDF'}</button>
        <button className="page-btn" disabled={!!busy} onClick={toOrder} style={{background:'var(--green)',color:'#fff'}}>🛒 Překlopit do objednávky</button>
        <button className="page-btn" disabled={!!busy} onClick={del} style={{color:'var(--red)'}}>🗑 {isNew ? 'Zahodit' : 'Smazat'}</button>
      </div>
    </div>
  );
}

function OfferProductRow({ p, inOffer, onAdd }) {
  return (
    <div className="offer-prow">
      <div className="offer-thumb">{offerImgOk(p.image) ? <img src={p.image} alt="" loading="lazy" onError={e => { e.target.style.visibility = 'hidden'; }}/> : null}</div>
      <div style={{minWidth:0,flex:1}}>
        <div style={{fontWeight:600,fontSize:13}}>{p.name}</div>
        <div style={{fontSize:11,color:'var(--text-muted)'}}>{[p.code, p.subtitle].filter(Boolean).join(' · ')}{(p.code || p.subtitle) ? ' · ' : ''}<span style={{color: p.stock !== false ? 'var(--green)' : 'var(--orange)'}}>{p.stock !== false ? 'skladem' : 'na objednávku'}</span></div>
      </div>
      <div style={{whiteSpace:'nowrap',fontSize:13,fontWeight:700}}>{fmtPrice(Math.round(Number(p.price) || 0))} <span style={{fontWeight:400,fontSize:11,color:'var(--text-muted)'}}>bez DPH</span></div>
      <button className="page-btn" onClick={onAdd} style={{padding:'4px 12px'}}>{inOffer ? '+1' : '+ Přidat'}</button>
    </div>
  );
}

/* Admin panel: přístup jen pro účty z ADMIN_EMAILS s ověřeným e-mailem (vynucují i pravidla Firestore).
   Dřívější heslo "fimas2026" bylo jen v prohlížeči a k datům na serveru přístup dát nemůže. */
function AdminPage() {
  const { user, setUser, showToast, setPage } = useApp();
  const [tab, setTab] = useState('customers');
  const [em, setEm] = useState('');
  const [pw, setPw] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);
  const [data, setData] = useState({ users: [], orders: [], withdrawals: [], offers: [], offersError: '', loaded: false, error: '' });
  const isAdmin = !!(user && user.uid && user.isAdmin);
  const tsOf = (o) => (o && o.createdAt && o.createdAt.seconds) || 0;
  useEffect(() => { if (user && user.isAdmin) { try { localStorage.setItem('adr_nostats', '1'); } catch {} } }, [user && user.isAdmin]);

  const load = useCallback(() => {
    const f = getFb(); if(!f) return;
    setData(d => ({ ...d, loaded: false, error: '' }));
    Promise.all(['users', 'orders', 'withdrawals'].map(c => f.db.collection(c).get().then(qs => qs.docs.map(d => ({ _id: d.id, ...d.data() })))))
      .then(([users, orders, withdrawals]) => setData(d => ({ ...d,
        users: users.sort((x, y) => tsOf(x) - tsOf(y)),
        orders: orders.sort((x, y) => tsOf(x) - tsOf(y)),
        withdrawals: withdrawals.sort((x, y) => tsOf(y) - tsOf(x)),
        loaded: true, error: '' })))
      .catch(e => setData(d => ({ ...d, loaded: true, error: fbErr(e) })));
    // Nabídky zvlášť – chybějící pravidlo pro "offers" nesmí shodit zbytek adminu
    f.db.collection('offers').get().then(qs => setData(d => ({ ...d, offers: qs.docs.map(x => ({ _id: x.id, ...x.data() })), offersError: '' })))
      .catch(e => setData(d => ({ ...d, offers: [], offersError: fbErr(e) })));
  }, []);
  useEffect(() => { if(isAdmin) load(); }, [isAdmin]);

  const login = async (e) => {
    e.preventDefault(); setErr('');
    const f = getFb(); if(!f) { setErr(FB_UNAVAILABLE); return; }
    setBusy(true);
    try { await f.auth.signInWithEmailAndPassword(em.trim(), pw); }
    catch(e2) { setErr(fbErr(e2)); }
    setBusy(false);
  };
  const refreshVerification = async () => {
    const f = getFb(); const cu = f && f.auth.currentUser; if(!cu) return;
    try {
      await cu.reload(); await cu.getIdToken(true);
      const ok = f.auth.currentUser.emailVerified;
      setUser(prev => ({ ...(prev || {}), emailVerified: ok, isAdmin: ok && isAdminEmail(cu.email) }));
      showToast(ok ? 'E-mail je ověřený' : 'E-mail zatím není ověřený');
    } catch(e2) { showToast(fbErr(e2)); }
  };
  const resend = async () => { const f = getFb(); const cu = f && f.auth.currentUser; if(!cu) return; try { await cu.sendEmailVerification(); showToast('Ověřovací e-mail odeslán na ' + cu.email); } catch(e2) { showToast(fbErr(e2)); } };
  const logout = async () => { const f = getFb(); try { f && await f.auth.signOut(); } catch {} setUser(null); };

  if(!isAdmin) {
    const card = (children) => (
      <div className="auth-page" style={{maxWidth:440}}>
        <div className="auth-card">
          <h2>⚙ Admin panel</h2>
          {children}
        </div>
      </div>
    );
    if(!getFb()) return card(<p className="sub">{FB_UNAVAILABLE}</p>);
    if(user && user.uid && isAdminEmail(user.email) && !user.emailVerified) return card(<>
      <p className="sub">Účet <strong>{user.email}</strong> má administrátorská práva, ale e-mail ještě není ověřený. Klikněte na odkaz v ověřovacím e-mailu (zkontrolujte i spam) a pak na tlačítko níže.</p>
      <button className="auth-btn" onClick={refreshVerification}>Už jsem ověřil – pokračovat</button>
      <button className="page-btn" style={{marginTop:10,width:'100%'}} onClick={resend}>Poslat ověřovací e-mail znovu</button>
    </>);
    if(user && user.uid) return card(<>
      <p className="sub">Jste přihlášen jako <strong>{user.email}</strong>. Tento účet nemá přístup do admin panelu.</p>
      <p style={{fontSize:12,color:'var(--text-muted)'}}>Přístup mají: {ADMIN_EMAILS.join(', ')}</p>
      <button className="auth-btn" onClick={logout}>Odhlásit a přihlásit se jinak</button>
    </>);
    return card(<>
      <p className="sub">Přihlaste se e-mailem administrátora ({ADMIN_EMAILS.join(', ')}).</p>
      <form onSubmit={login}>
        <div className="auth-field"><label>E-mail</label><input type="email" autoCapitalize="none" autoCorrect="off" value={em} onChange={e=>setEm(e.target.value)} required autoFocus/></div>
        <div className="auth-field"><label>Heslo</label><input type="password" value={pw} onChange={e=>setPw(e.target.value)} required/></div>
        {err && <p style={{color:'var(--red)',fontSize:13,marginTop:8}}>{err}</p>}
        <button className="auth-btn" type="submit" disabled={busy}>{busy ? 'Přihlašuji…' : 'Přihlásit'}</button>
      </form>
      <p style={{fontSize:12,color:'var(--text-muted)',marginTop:12}}>Nemáte ještě účet? <a onClick={()=>setPage('register')} style={{color:'var(--blue)',cursor:'pointer'}}>Zaregistrujte se</a> jedním z uvedených e-mailů a potvrďte odkaz v ověřovacím e-mailu.</p>
    </>);
  }

  const users = data.users;
  const orders = data.orders;

  const exportCSV = (data, filename) => {
    if(!data.length) return;
    const keys = Object.keys(data[0]);
    const csv = [keys.join(';'), ...data.map(r => keys.map(k => '"'+(r[k]||'')+'"').join(';'))].join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; a.click();
  };

  return (
    <div className="container" style={{maxWidth:1100}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
        <h2 style={{margin:0}}>⚙ Admin panel</h2>
        <span style={{fontSize:13,color:'var(--text-muted)'}}>{user.email} · <a onClick={load} style={{color:'var(--blue)',cursor:'pointer'}}>↻ Obnovit</a> · <a onClick={logout} style={{color:'var(--red)',cursor:'pointer'}}>Odhlásit</a></span>
      </div>
      {!data.loaded && <p style={{color:'var(--text-muted)'}}>Načítám data z databáze…</p>}
      {data.error && <p style={{color:'var(--red)',fontWeight:600}}>{data.error}</p>}
      <div style={{display:'flex',gap:8,margin:'16px 0 24px',flexWrap:'wrap'}}>
        <button className={`page-btn${tab==='customers'?' active':''}`} onClick={()=>setTab('customers')}>
          Zákazníci ({users.length})

                iframe.contentDocument.open();

                await new Promise(r => setTimeout(r, 500));
                try {
                  const canvas = await html2canvas(iframe.contentDocument.body, {
                    scale: 2, useCORS: true, allowTaint: true, width: 900,
                    windowWidth: 900, backgroundColor: '#ffffff'
                  });
                  const { jsPDF } = window.jspdf;
                  const pdf = new jsPDF('p', 'mm', 'a4');
                  const pdfW = pdf.internal.pageSize.getWidth();
                  const pdfH = pdf.internal.pageSize.getHeight();
                  const imgW = pdfW - 20;
                  const imgH = (canvas.height * imgW) / canvas.width;
                  let yOff = 10;
                  const pageContentH = pdfH - 20;
                  if (imgH <= pageContentH) {
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 10, yOff, imgW, imgH);
                  } else {
                    let srcY = 0;
                    const sliceH = Math.floor(canvas.width * pageContentH / imgW);
                    while (srcY < canvas.height) {
                      const h = Math.min(sliceH, canvas.height - srcY);
                      const sliceCanvas = document.createElement('canvas');
                      sliceCanvas.width = canvas.width;
                      sliceCanvas.height = h;
                      sliceCanvas.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, h, 0, 0, canvas.width, h);
                      const sliceImgH = (h * imgW) / canvas.width;
                      if (srcY > 0) pdf.addPage();
                      pdf.addImage(sliceCanvas.toDataURL('image/jpeg', 0.95), 'JPEG', 10, 10, imgW, sliceImgH);
                      srcY += h;
                    }
                  }
                  pdf.save(`objednavka-${o.id || 'ADR'}.pdf`);
                } catch(err) { console.error('PDF export error:', err); alert('Chyba při exportu PDF. Zkuste tisk do PDF.'); }

                      </div>
                    </div>
                    <div style={{display:'flex',gap:6}}>
                      <button className="page-btn" onClick={printOrder} title="Zobrazit a vytisknout">🖨️ Tisk</button>
                      <button className="page-btn" onClick={exportPDF} title="Stáhnout jako PDF" style={{background:'var(--red)',color:'#fff'}}>📄 PDF</button>

/* ===================== OZNÁMENÍ – žlutý pruh nahoře =====================
   Text a platnost se upravují v ⚙ Adminu → Oznámení (Firestore settings/notice, číst může každý,
   měnit jen admin). Stejná pravidla jako na fimas.cz: mimo "platnost od/do" se pruh skryje sám. */
function noticeActive(n, now = new Date()) {
  if(!n || !String(n.text || '').trim()) return false;
  if(n.from && now < new Date(n.from + 'T00:00:00')) return false;
  if(n.until && now > new Date(n.until + 'T23:59:59')) return false;
  return true;
}
function NoticeBar() {
  const [n, setN] = useState(null);
  const [closed, setClosed] = useState('');
  useEffect(() => {
    const f = getFb(); if(!f) return;
    return f.db.collection('settings').doc('notice').onSnapshot(d => setN(d.exists ? d.data() : null), () => {});
  }, []);
  useEffect(() => { try { setClosed(sessionStorage.getItem('adr_notice_closed') || ''); } catch {} }, []);
  if(!noticeActive(n)) return null;
  const text = String(n.text).split(/\r?\n/).map(x => x.trim()).filter(Boolean).join(' ');
  if(closed === text) return null;
  const close = () => { setClosed(text); try { sessionStorage.setItem('adr_notice_closed', text); } catch {} };
  return (
    <div className="notice-bar" role="status">
      <span>{text}</span>
      <button aria-label="Zavřít" onClick={close}>×</button>
    </div>
  );
}

function NoticeAdmin() {
  const { showToast } = useApp();
  const [n, setN] = useState({ text:'', from:'', until:'' });
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);
  useEffect(() => {
    const f = getFb(); if(!f) return;
    f.db.collection('settings').doc('notice').get()
      .then(d => { if(d.exists) { const x = d.data(); setN({ text:x.text||'', from:x.from||'', until:x.until||'' }); } setLoaded(true); })
      .catch(e => { showToast(fbErr(e)); setLoaded(true); });

  const save = async (data) => {
    const f = getFb(); if(!f) return;
    if(data.from && data.until && data.until < data.from) { showToast('Datum „do“ je dřív než „od“'); return; }
    setSaving(true);

      await f.db.collection('settings').doc('notice').set({ text: data.text.trim(), from: data.from || '', until: data.until || '', updatedAt: f.ts(), updatedBy: (f.auth.currentUser && f.auth.currentUser.email) || '' });

      <p style={{fontWeight:700,color:status[1]}}>● {status[0]}</p>
      <div className="auth-field"><label>Text oznámení</label>
        <textarea rows={3} value={n.text} onChange={e=>setN({...n,text:e.target.value})} placeholder="Např. Od 22. 12. do 2. 1. máme zavřeno – objednávky vyřídíme po Novém roce." style={{width:'100%',padding:10,borderRadius:8,border:'1px solid var(--border)',fontSize:14,fontFamily:'inherit'}}/>
      </div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
        <div className="auth-field"><label>Platnost od (nepovinné)</label><input type="date" value={n.from} onChange={e=>setN({...n,from:e.target.value})}/></div>
        <div className="auth-field"><label>Platnost do (nepovinné)</label><input type="date" value={n.until} onChange={e=>setN({...n,until:e.target.value})}/></div>
      </div>
      {n.text.trim() && (<>
        <p style={{fontSize:12,color:'var(--text-muted)',margin:'8px 0 4px'}}>Náhled:</p>
        <div className="notice-bar" style={{borderRadius:8}}><span>{n.text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).join(' ')}</span><button aria-hidden="true" tabIndex={-1}>×</button></div>
      </>)}

        <button className="page-btn" disabled={saving} onClick={()=>save({text:'',from:'',until:''})}>Vypnout oznámení</button>

  );

/* Provozní doba chatu – musí odpovídat rozvrhu v dashboard.tawk.to (Administration → Chat Widget → Scheduler).
   Mimo tuto dobu se Tawk.to vůbec nenačítá (jinak by hlásil, že se nemůže připojit) a místo chatu nabídneme e-mail / WhatsApp / telefon. */
const CHAT_SCHEDULE = { days: [1, 2, 3, 4, 5], from: '07:00', to: '14:45', label: 'Po–Pá 7:00–14:45' };
function chatOpenNow(d) {
  try {
    const parts = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Prague', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d || new Date());
    const get = (t) => (parts.find(x => x.type === t) || {}).value;
    const wd = { Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6, Sun: 0 }[get('weekday')];
    const mins = (+get('hour') % 24) * 60 + (+get('minute'));
    const toMin = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
    return CHAT_SCHEDULE.days.includes(wd) && mins >= toMin(CHAT_SCHEDULE.from) && mins < toMin(CHAT_SCHEDULE.to);
  } catch(e) { return true; }
}

/* Cena dopravy v chatu: když zákazník klikne na „Chci znát cenu dopravy“ (nebo napíše o dopravě/poštovném),
   pošleme operátorovi obsah košíku – atributy návštěvníka (panel vpravo v dashboard.tawk.to), událost v chatu
   a štítek „cena-dopravy“. Tawk.to: klíče jen písmena/čísla/pomlčky, hodnota max 255 znaků, max 50 atributů. */
const CHAT_SHIPPING_RE = /dopravy|dopravu|doprava|po[šs]tovn|balné|balne/i;
function chatCartAttrs(cart, prevCount) {
  const items = (Array.isArray(cart) ? cart : []).filter(i => i && i.qty > 0);
  const clip = (s) => String(s).replace(/\s+/g, ' ').trim().slice(0, 250) || '-';
  const pcs = items.reduce((s, i) => s + (+i.qty || 0), 0);
  const net = items.reduce((s, i) => s + (+i.qty || 0) * (+i.price || 0), 0);
  const polozek = (n) => n + (n === 1 ? ' položka' : n >= 2 && n <= 4 ? ' položky' : ' položek');
  const attrs = { 'kosik': items.length ? clip(`${polozek(items.length)}, ${pcs} ks, ${fmtPrice(net)} bez DPH (adrparts.cz)`) : 'prázdný (adrparts.cz)' };
  const shown = items.slice(0, 40);
  shown.forEach((i, n) => {
    attrs['kosik-' + (n + 1)] = clip(`${i.qty}× ${i.name}${i.code ? ' [' + i.code + ']' : ''} – ${fmtPrice(i.price)}/ks bez DPH`);
  });
  if (items.length > shown.length) attrs['kosik-41'] = `… a další ${polozek(items.length - shown.length)}`;
  // starší položky z dřívějšího odeslání přepsat (prázdnou hodnotu Tawk.to nepřijme)
  for (let n = shown.length + 1; n <= Math.min(prevCount || 0, 40); n++) attrs['kosik-' + n] = '-';
  return { attrs, items: items.length, pcs, net };
}
function sendCartToChat() {
  const T = window.Tawk_API;
  if (!T || !T.setAttributes || Date.now() - (window.__chatCartAt || 0) < 10000) return;
  window.__chatCartAt = Date.now();
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('adr_cart') || '[]'); } catch(e) {}
  const r = chatCartAttrs(cart, window.__chatCartSent || 0);
  window.__chatCartSent = r.items;
  try { T.setAttributes(r.attrs, (err) => { if (err) console.warn('[chat] setAttributes', err); }); } catch(e) {}
  try { T.addEvent('cena-dopravy', { polozek: String(r.items), kusu: String(r.pcs), 'bez-dph': fmtPrice(r.net) }, (err) => { if (err) console.warn('[chat] addEvent', err); }); } catch(e) {}
  try { T.addTags(['cena-dopravy'], () => {}); } catch(e) {}
}
function chatVisitorText(m) { return typeof m === 'string' ? m : (m && (m.message || m.text || m.msg)) || ''; }

function ChatWidget() {
  // Tawk.to live chat — stejný účet jako obchod.fimas.cz (dashboard.tawk.to)
  // Bez souhlasu se zobrazí vlastní tlačítko "Chat"; kliknutí = souhlas → načte Tawk.to a rovnou otevře okno.
  const [allowed, setAllowed] = useState(() => !!(getCookieConsent() || {}).chat);
  const [loading, setLoading] = useState(false);
  const [note, setNote] = useState('');
  const [openNow, setOpenNow] = useState(() => chatOpenNow());
  const [offlineCard, setOfflineCard] = useState(false);
  const openOnLoad = useRef(false);
  useEffect(() => {
    const h = () => setAllowed(!!(getCookieConsent() || {}).chat);
    window.addEventListener('adr-consent', h); return () => window.removeEventListener('adr-consent', h);
  }, []);
  // každou minutu přepočítat provozní dobu (stránka může být otevřená přes 14:45 / 7:00)
  useEffect(() => { const t = setInterval(() => setOpenNow(chatOpenNow()), 60000); return () => clearInterval(t); }, []);
  useEffect(() => {
    if (openNow) { setOfflineCard(false); return; }
    // po skončení provozní doby schovat bublinu Tawk.to (pokud už byla načtená)
    if (window.__tawkLoaded && window.Tawk_API && window.Tawk_API.hideWidget) { try { window.Tawk_API.hideWidget(); } catch(e) {} }
    setLoading(false); setNote('');
  }, [openNow]);
  useEffect(() => {
    if (!allowed || !openNow) return;
    if (window.__tawkLoaded) { try { window.Tawk_API.showWidget && window.Tawk_API.showWidget(); } catch(e) {} return; }
    if (location.protocol === 'file:') { setNote('Chat funguje jen na webu ' + COMPANY.web + ' (ne v souboru otevřeném z disku).'); return; }
    window.__tawkLoaded = true;
    setLoading(true);
    window.Tawk_API = window.Tawk_API || {};
    window.Tawk_LoadStart = new Date();
    window.Tawk_API.onChatMessageVisitor = function(m) {
      if (CHAT_SHIPPING_RE.test(chatVisitorText(m))) sendCartToChat();
    };
    window.Tawk_API.onLoad = function() {
      setLoading(false);
      if (openOnLoad.current) { try { window.Tawk_API.maximize(); } catch(e) {} openOnLoad.current = false; }
    };
    var s1 = document.createElement('script');
    s1.async = true;
    s1.src = 'https://embed.tawk.to/6ab6228e83558434439a0190/1k3bne1a2';
    s1.charset = 'UTF-8';
    s1.setAttribute('crossorigin', '*');
    s1.onerror = () => { setLoading(false); window.__tawkLoaded = false; setNote('Chat se nepodařilo načíst. Napište nám na WhatsApp ' + COMPANY.mobile + '.'); };
    document.head.appendChild(s1);
    const t = setTimeout(() => {
      if (!window.Tawk_API || !window.Tawk_API.getStatus) {
        setLoading(false);
        // těsně před koncem provozní doby už Tawk.to widget nespustí → nabídnout kontakty, ne chybu
        if (!chatOpenNow()) { setOpenNow(false); setOfflineCard(true); }
        else setNote('Chat se nenačetl (může ho blokovat doplněk prohlížeče). Napište nám na WhatsApp ' + COMPANY.mobile + '.');
      }
    }, 15000);
    return () => clearTimeout(t);
  }, [allowed, openNow]);

  const startChat = () => {
    if (!chatOpenNow()) { setOpenNow(false); setOfflineCard(v => !v); return; }
    openOnLoad.current = true;
    if (location.protocol === 'file:') { setNote('Chat funguje jen na webu ' + COMPANY.web + ' (ne v souboru otevřeném z disku).'); return; }
    const prev = getCookieConsent() || {};
    try { localStorage.setItem(COOKIE_KEY, JSON.stringify({ ...prev, chat: true, date: new Date().toISOString() })); } catch {}
    window.dispatchEvent(new Event('adr-consent'));
    setAllowed(true);
  };

  if (openNow && allowed && window.__tawkLoaded && !loading && !note) return null; // Tawk.to má vlastní bublinu
  return (
    <div className="chat-fab" style={{position:'fixed',right:20,bottom:84,zIndex:1400,display:'flex',flexDirection:'column',alignItems:'flex-end',gap:8}}>
      {note && <div style={{maxWidth:260,background:'#fff',color:'#111',fontSize:12,padding:'8px 12px',borderRadius:10,boxShadow:'0 4px 16px rgba(0,0,0,0.25)'}}>{note}</div>}
      {!openNow && offlineCard && (
        <div className="chat-offline-card" role="dialog" aria-label="Chat mimo provozní dobu">
          <button className="chat-offline-close" onClick={() => setOfflineCard(false)} aria-label="Zavřít">×</button>
          <strong>Online chat je teď mimo provoz</strong>
          <p>Chatujeme <b>{CHAT_SCHEDULE.label}</b>. Mimo tuto dobu nám napište – odpovíme hned další pracovní den.</p>
          <a href={`https://wa.me/${COMPANY.whatsapp}`} target="_blank" rel="noopener">🟢 WhatsApp {COMPANY.mobile}</a>
          <a href={`mailto:${COMPANY.email}`}>✉️ {COMPANY.email}</a>
          <a href={`tel:${COMPANY.phone.replace(/\s/g, '')}`}>📞 {COMPANY.phone} ({COMPANY.hours})</a>
        </div>
      )}
      <button onClick={startChat} aria-label={openNow ? 'Otevřít chat' : 'Kontakt – chat je mimo provoz'} title={openNow ? 'Chat s FIMAS' : 'Chat ' + CHAT_SCHEDULE.label} className="chat-fab-btn"
        style={{display:'flex',alignItems:'center',gap:8,padding:'12px 18px',borderRadius:28,border:'none',cursor:'pointer',
          background: openNow ? 'var(--gold)' : '#cbd5e1',color:'#000',fontWeight:800,fontSize:14,boxShadow:'0 4px 16px rgba(0,0,0,0.3)'}}>
        <span style={{fontSize:18}}>💬</span><span className="chat-fab-label">{!openNow ? 'Napište nám' : loading ? 'Načítám chat…' : 'Chat'}</span>
      </button>
    </div>
  );
}

function BackToTop() {
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const onScroll = () => setVisible(window.scrollY > 400);
    window.addEventListener('scroll', onScroll, {passive:true});
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <button className={`back-top${visible?' visible':''}`} onClick={()=>window.scrollTo({top:0,behavior:'smooth'})}>
      <Icon name="chevUp" size={22}/>
    </button>
  );
}

/* ===================== APP ===================== */
function App() {
  const [page, setPageState] = useState('home');
  const [products, setProducts] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterCategory, setFilterCategory] = useState('');
  const [filterSubcategory, setFilterSubcategory] = useState('');
  const [selectedProduct, setSelectedProduct] = useState(null);
  const [cart, setCart] = useLocalStorage('adr_cart', []);
  const [user, setUser] = useLocalStorage('adr_user', null);
  // Firebase: přihlášený uživatel + profil z Firestore (funguje napříč zařízeními)
  useEffect(() => {
    const f = getFb();
    if (!f) return;
    return f.auth.onAuthStateChanged(async (u) => {
      if (!u) { setUser(null); return; }
      const base = { uid: u.uid, email: u.email, emailVerified: u.emailVerified, isAdmin: isAdminEmail(u.email) && u.emailVerified };
      setUser(prev => ({ ...(prev && prev.uid === u.uid ? prev : { name: u.displayName || '' }), ...base }));
      try {
        const snap = await f.db.collection('users').doc(u.uid).get();
        if (snap.exists) setUser(prev => ({ ...(prev || {}), ...snap.data(), ...base }));
      } catch (e) { console.warn('[ADR E-shop] Profil se nenačetl:', fbErr(e)); }
    });
  }, []);
  const [favorites, setFavorites] = useLocalStorage('adr_favorites', []);
  const [toast, setToast] = useState(null);

  const setPage = useCallback((p) => { setPageState(p); window.scrollTo(0,0); }, []);
  useEffect(() => { const t = setTimeout(trackVisit, 400); return () => clearTimeout(t); }, [page]);
  const showToast = useCallback((msg) => { setToast(msg); }, []);

  const addToCart = useCallback((product, qty=1) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === product.id);
      if(existing) return prev.map(i => i.id === product.id ? {...i, qty: i.qty + qty} : i);
      return [...prev, { id:product.id, code:product.code, name:product.name, subtitle:product.subtitle||'', price:product.price, image:product.image||'', url:product.url||'', qty }];
    });
  }, []);

  const updateCartQty = useCallback((id, qty) => {
    if(qty <= 0) { setCart(prev => prev.filter(i => i.id !== id)); return; }
    setCart(prev => prev.map(i => i.id === id ? {...i, qty} : i));
  }, []);

  const removeFromCart = useCallback((id) => { setCart(prev => prev.filter(i => i.id !== id)); }, []);

  const toggleFavorite = useCallback((productId) => {
    setFavorites(prev => prev.includes(productId) ? prev.filter(id => id !== productId) : [...prev, productId]);
  }, []);

  // Load products: merge EMBEDDED_PRODUCTS with data.json from scraper
  const [lastUpdated, setLastUpdated] = useState(null);
  const [typeIndex, setTypeIndex] = useState(() => (TYPE_INDEX = fallbackTypeIndex()));
  const [details, setDetails] = useState(null);
  useEffect(() => {
    fetch(DETAILS_URL, { cache: 'no-cache' }).then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(j => { DETAILS = j; setDetails(j); })
      .catch(e => console.warn('[ADR E-shop] adr-details.json nenačteno', e));
  }, []);
  // Skrytý vstup do adminu: adrparts.cz/#admin (tlačítko v menu vidí jen přihlášený admin)
  useEffect(() => {
    const h = () => { if(location.hash === '#admin') { setPage('admin'); history.replaceState(null, '', location.pathname + location.search); } };
    h(); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h);
  }, []);
  const refreshProducts = useCallback(() => {
    fetch(DATA_JSON_URL + '?t=' + Date.now(), { cache: 'no-store' })
      .then(r => { if(!r.ok) return Promise.reject('fetch failed'); const lm = r.headers.get('last-modified'); return r.json().then(j => [j, lm]); })
      .then(([dataJson, lastMod]) => {
        const merged = mergeProducts(EMBEDDED_PRODUCTS, dataJson);
        const idx = buildTypeIndex(dataJson);
        if(idx.ready) { TYPE_INDEX = idx; setTypeIndex(idx); console.log('[ADR E-shop] Typy: ' + idx.axles.size + ' náprav, ' + idx.brakes.length + ' brzd z obchod.fimas.cz'); }
        setProducts(merged);
        setLastUpdated(lastMod ? new Date(lastMod) : new Date());
        // Košík: přecenit položky podle aktuálních dat
        setCart(prev => prev.map(i => { const np = merged.find(x => x.id === i.id); return !i.fixedPrice && np && np.price && np.price !== i.price ? { ...i, price: np.price } : i; }));
        setLoading(false);
        console.log('[ADR E-shop] Data refreshed: ' + merged.length + ' products');
      })
      .catch(() => {
        console.warn('[ADR E-shop] data.json fetch failed, using embedded products only');
        if(products.length === 0) setProducts(EMBEDDED_PRODUCTS);
        setLoading(false);
      });
  }, []);

  // Initial load
  useEffect(() => { refreshProducts(); }, []);

  // AUTO-UPDATE: re-fetch data.json every 15 minutes for price/stock/item updates
  useEffect(() => {
    const interval = setInterval(() => {
      console.log('[ADR E-shop] Auto-refresh triggered');
      refreshProducts();
    }, 15 * 60 * 1000); // 15 minutes
    return () => clearInterval(interval);
  }, [refreshProducts]);

  const ctx = {
    page, setPage, products, loading, search, setSearch,
    filterCategory, setFilterCategory, filterSubcategory, setFilterSubcategory,
    selectedProduct, setSelectedProduct, cart, setCart, user, setUser,
    addToCart, updateCartQty, removeFromCart, toggleFavorite, favorites, showToast,
    lastUpdated, refreshProducts, typeIndex, details
  };

  const renderPage = () => {
    switch(page) {
      case 'home': return <><Hero/><AxleIdentification/><CategoryGrid/></>;
      case 'catalog': return <CatalogPage/>;
      case 'axle-id': return <AxleIdentification/>;
      case 'detail': return <DetailPage/>;
      case 'cart': return <CartPage/>;
      case 'checkout': return <CheckoutPage/>;
      case 'order-success': return <OrderSuccessPage/>;
      case 'login': return <LoginPage/>;
      case 'register': return <RegisterPage/>;
      case 'account': return <AccountPage/>;
      case 'favorites': return <FavoritesPage/>;
      case 'info': return <InfoPage/>;
      case 'terms': return <TermsPage/>;
      case 'gdpr': return <GdprPage/>;
      case 'withdrawal': return <WithdrawalPage/>;
      case 'contact': return <ContactPage/>;
      case 'admin': return <AdminPage/>;
      default: return <><Hero/><AxleIdentification/><CategoryGrid/></>;
    }
  };

  return (
    <AppContext.Provider value={ctx}>
      <div style={{display:'flex',flexDirection:'column',minHeight:'100vh'}}>
        <NoticeBar/>
        <Header/>
        {loading ? (
          <div className="loading-state" style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'}}>
            <div className="spinner"></div>
            <p>Načítání katalogu...</p>
          </div>
        ) : (
          <main style={{flex:1}}>{renderPage()}</main>
        )}
        <Footer/>
        <ChatWidget/>
        <CookieBar/>
        <BackToTop/>
        {toast && <Toast message={toast} onClose={()=>setToast(null)}/>}
      </div>
    </AppContext.Provider>
  );
}
