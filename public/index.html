/* ===================== CHECKOUT PAGE ===================== */
function readOfferCheckout(cart) {
  try {
    const pre = JSON.parse(sessionStorage.getItem(OFFER_CHECKOUT_KEY) || 'null');
    return pre && pre.offerId && cart.some(i => i.offerNo === pre.offerId) ? pre : null;
  } catch { return null; }
}
function CheckoutPage() {
  const { cart, user, setPage, setCart, showToast } = useApp();
  const [offerPre] = useState(() => readOfferCheckout(cart));
  const [form, setForm] = useState(() => offerPre ? { ...offerPre.form, paymentMethod: 'cod' } : {
    name: user?.name || '', email: user?.email || '', phone: user?.phone || '',
    company: user?.company || '', ico: user?.ico || '', dic: user?.dic || '',
    street: user?.street || '', city: user?.city || '', zip: user?.zip || '',
    note: '', paymentMethod: 'cod',
  });
  const [sending, setSending] = useState(false);
  const [error, setError] = useState('');
  const [agree, setAgree] = useState(false);
  const [legal, setLegal] = useState(null);

  const subtotal = cart.reduce((s,i) => s + i.price * i.qty, 0);
  const vatTotal = Math.round(subtotal * COMPANY.vatRate);
  const total = subtotal + vatTotal;

  const handleChange = (key, val) => setForm(f => ({...f, [key]: val}));

  const handleSubmit = async (e) => {
    e.preventDefault();
    if(!form.name || !form.email || !form.phone || !form.street || !form.city || !form.zip || !form.paymentMethod) {
      setError('Vyplňte prosím všechna povinná pole včetně způsobu platby.');
      return;
    }
    if(!agree) { setError('Pro odeslání objednávky je nutný souhlas s obchodními podmínkami.'); return; }
    setSending(true);
    setError('');

    const orderNum = 'ADR-' + Date.now().toString(36).toUpperCase();
    const orderDate = new Date().toLocaleDateString('cs-CZ', {day:'numeric',month:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'});

    // Build HTML order summary with product images
    const htmlOrder = buildOrderHTML(orderNum, orderDate, form, cart, subtotal, vatTotal, total, PAY_LABELS);

    // Store order locally (with form data for reprint)
    try {
      const orders = JSON.parse(localStorage.getItem('adr_orders') || '[]');
      orders.push({ id: orderNum, date: orderDate, items: cart, form, paymentMethod: form.paymentMethod, subtotal, vatTotal, total, termsAccepted: new Date().toISOString(), termsVersion: LEGAL_VERSION });
      localStorage.setItem('adr_orders', JSON.stringify(orders));
    } catch {}
    // Uložit do Firestore → admin panel a "Moje objednávky" na všech zařízeních
    fbSaveDoc('orders', orderNum, { id: orderNum, date: orderDate, items: cart.map(i => ({ id:i.id, code:i.code||'', name:i.name, subtitle:i.subtitle||'', price:i.price, qty:i.qty, url:i.url||'', image:i.image||'' })), form, paymentMethod: form.paymentMethod, subtotal, vatTotal, total, termsAccepted: new Date().toISOString(), termsVersion: LEGAL_VERSION, ...(offerPre ? { offerId: offerPre.offerId } : {}) }, offerPre ? { noUid: true } : null);
    // Objednávka z nabídky (vytváří admin za zákazníka) → nabídku označit jako objednanou
    if (offerPre) {
      const fb = getFb();
      if (fb) fb.db.collection('offers').doc(offerPre.offerId).set({ status: 'ordered', orderId: orderNum, orderedAt: new Date().toISOString(), updatedAt: fb.ts() }, { merge: true }).catch(e => console.warn('[ADR E-shop] offer update failed', fbErr(e)));
      try { sessionStorage.removeItem(OFFER_CHECKOUT_KEY); } catch {}
    }

    // Open HTML order in new window — customer can print / save as PDF
    const orderWin = window.open('', '_blank');
    if (orderWin) {
      orderWin.document.write(htmlOrder);
      orderWin.document.close();
    }

    // Customer version: same order HTML + thank-you intro + legal info (§ 1824 OZ)
    const termsAcceptedAt = new Date().toLocaleString('cs-CZ');
    const customerIntro = `
<div style="font-family:Arial,Helvetica,sans-serif;max-width:800px;margin:0 auto 16px;padding:16px 20px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc;color:#111;font-size:14px;line-height:1.55">
  <p style="margin:0 0 8px;font-size:16px"><strong>Dobrý den${form.name ? ', ' + String(form.name).replace(/[<>&]/g,'') : ''},</strong></p>
  <p style="margin:0 0 8px">děkujeme za vaši objednávku <strong>${orderNum}</strong> v e-shopu ${COMPANY.web}. Tímto potvrzujeme její přijetí. Níže najdete rekapitulaci objednávky.</p>
  <p style="margin:0 0 8px;padding:8px 12px;background:#fff7ed;border:1px solid #fdba74;border-radius:8px;color:#9a3412"><strong>⚠️ Poštovné a balné NENÍ zahrnuto v ceně objednávky a NENÍ zdarma.</strong> Před expedicí vás budeme kontaktovat s přesnou cenou dopravy dle povahy a hmotnosti zásilky.</p>
  <p style="margin:0 0 8px">Obchodní podmínky (odsouhlaseny ${termsAcceptedAt}): <a href="${COMPANY.url}">${COMPANY.url}</a> → Obchodní podmínky. Jako spotřebitel můžete od smlouvy odstoupit bez udání důvodu do 14 dnů od převzetí zboží – formulář najdete na ${COMPANY.url} → Odstoupení od smlouvy, případně nám odstoupení zašlete na ${COMPANY.email}.</p>
  <p style="margin:0">S dotazy na tento e-mail jednoduše odpovězte (odpověď dorazí na <a href="mailto:${COMPANY.email}">${COMPANY.email}</a>), nebo volejte tel. ${COMPANY.phone} nebo WhatsApp ${COMPANY.mobile}.<br>S pozdravem tým ${COMPANY.name}</p>
</div>`;
    const customerHtml = htmlOrder.replace(/<body([^>]*)>/i, (m) => m + customerIntro);

    // Send HTML order email via Cloud Function (to FIMAS + customer)
    let emailSent = false;
    try {
      const resp = await fetch(EMAIL_FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'order',
          html: htmlOrder,
          customerHtml,
          termsAcceptedAt,
          customerEmail: form.email,
          customerName: form.name,
          orderNumber: orderNum,
          subject: `Objednávka ${orderNum} – Náhradní díly ADR`
        })
      });
      const result = await resp.json();
      emailSent = result.success;
      if (!emailSent) console.warn('Email send error:', result);
    } catch (err) {
      console.warn('Email Cloud Function not available, falling back to mailto:', err);
    }

    // Fallback: open mailto if Cloud Function failed or not deployed yet
    if (!emailSent) {
      const itemLines = cart.map((item, i) =>
        `${i+1}. ${item.name} (${item.qty} ks × ${fmtPrice(item.price)}) = ${fmtPrice(item.price * item.qty)}`
      ).join('\n');
      const mailText = [
        `OBJEDNÁVKA ${orderNum}`, `Datum: ${orderDate}`, ``,
        `ZÁKAZNÍK: ${form.name}`, `E-mail: ${form.email}`, `Telefon: ${form.phone}`,
        form.company ? `Firma: ${form.company}` : '', form.ico ? `IČO: ${form.ico}` : '', form.dic ? `DIČ: ${form.dic}` : '',
        ``, `ADRESA: ${form.street}, ${form.zip} ${form.city}`,
        `PLATBA: ${PAY_LABELS[form.paymentMethod] || form.paymentMethod}`,
        ``, `POLOŽKY:`, itemLines, ``,
        `Mezisoučet bez DPH: ${fmtPrice(subtotal)}`, `DPH 21%: ${fmtPrice(vatTotal)}`, `CELKEM S DPH: ${fmtPrice(total)}`,
        ``, `⚠ Poštovné a balné NENÍ zahrnuto v ceně a NENÍ zdarma.`,
        form.note ? `\nPoznámka: ${form.note}` : '',
        ``, `---`, `FIMAS s.r.o. | ${COMPANY.address} | ${COMPANY.phone} | ${COMPANY.email}`,
      ].filter(Boolean).join('\n');
      const subject = encodeURIComponent(`Objednávka ${orderNum} – Náhradní díly ADR`);
      const mailBody = encodeURIComponent(mailText);
      window.location.href = `mailto:${ORDER_EMAIL}?subject=${subject}&body=${mailBody}`;
    }

    setSending(false);
    setCart([]);
    setPage('order-success');
  };

  if(cart.length === 0) { setPage('catalog'); return null; }

  return (
    <div className="checkout-page">
      <h2>📋 Objednávka</h2>
      {offerPre && <div style={{margin:'0 0 16px',padding:'10px 14px',border:'1px solid var(--green)',borderRadius:10,background:'#f0fdf4',fontSize:14}}>
        📄 Objednávka podle nabídky <strong>{offerPre.offerId}</strong> – údaje zákazníka jsou předvyplněné z nabídky, ceny položek odpovídají nabídce. Zkontrolujte adresu a způsob platby. Potvrzení dostane zákazník na <strong>{form.email}</strong>.
      </div>}

      <div className="shipping-notice" style={{marginBottom:20}}>
        <span className="warn-icon">⚠️</span>
        <div>
          <p><strong>Poštovné a balné není zahrnuto v ceně objednávky!</strong></p>
          <p>Po přijetí objednávky vás budeme kontaktovat s přesnou cenou dopravy dle povahy a hmotnosti zásilky. Doprava <strong>NENÍ zdarma</strong>.</p>
        </div>
      </div>

      <form onSubmit={handleSubmit}>
        <div className="form-section">
          <h3>Kontaktní údaje</h3>
          <div className="form-row">
            <div className="form-field">
              <label>Jméno a příjmení <span className="req">*</span></label>
              <input value={form.name} onChange={e=>handleChange('name',e.target.value)} required />
            </div>
            <div className="form-field">
              <label>Telefon <span className="req">*</span></label>
              <input type="tel" value={form.phone} onChange={e=>handleChange('phone',e.target.value)} required />
            </div>
          </div>
          <div className="form-row">
            <div className="form-field full">
              <label>E-mail <span className="req">*</span></label>
              <input type="email" value={form.email} onChange={e=>handleChange('email',e.target.value)} required />
            </div>
          </div>
        </div>

        <div className="form-section">
          <h3>Fakturační údaje (nepovinné)</h3>
          <div className="form-row">
            <div className="form-field">
              <label>Firma</label>
              <input value={form.company} onChange={e=>handleChange('company',e.target.value)} />
            </div>
            <div className="form-field">
              <label>IČO</label>
              <input value={form.ico} onChange={e=>handleChange('ico',e.target.value)} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-field full">
              <label>DIČ</label>
              <input value={form.dic} onChange={e=>handleChange('dic',e.target.value)} />
            </div>
          </div>
        </div>

        <div className="form-section">
          <h3>Adresa doručení</h3>
          <div className="form-row">
            <div className="form-field full">
              <label>Ulice a číslo <span className="req">*</span></label>
              <input value={form.street} onChange={e=>handleChange('street',e.target.value)} required />
            </div>
          </div>
          <div className="form-row">
            <div className="form-field">
              <label>Město <span className="req">*</span></label>
              <input value={form.city} onChange={e=>handleChange('city',e.target.value)} required />
            </div>
            <div className="form-field">
              <label>PSČ <span className="req">*</span></label>
              <input value={form.zip} onChange={e=>handleChange('zip',e.target.value)} required />
            </div>
          </div>
        </div>

        <div className="form-section">
          <h3>Způsob platby <span className="req">*</span></h3>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {[
              {value:'cod', label:'Dobírka', desc:'Platba při převzetí zásilky', icon:'📦'},
              {value:'prepaid', label:'Platba předem', desc:'Zálohová faktura — zboží odesláno po připsání platby', icon:'💳'},
              {value:'transfer', label:'Platba převodem', desc:'Pouze pro smluvní zákazníky se smlouvou o odběru', icon:'🏦'},
            ].map(pm => (
              <label key={pm.value} style={{display:'flex',alignItems:'flex-start',gap:12,padding:'14px 16px',
                background:form.paymentMethod===pm.value?'rgba(212,175,55,0.1)':'var(--surface)',
                border:form.paymentMethod===pm.value?'2px solid var(--gold)':'2px solid var(--border)',
                borderRadius:'var(--radius)',cursor:'pointer',transition:'var(--transition)'}}>
                <input type="radio" name="paymentMethod" value={pm.value} checked={form.paymentMethod===pm.value}
                  onChange={e=>handleChange('paymentMethod',e.target.value)}
                  style={{marginTop:3,accentColor:'var(--gold)'}} />
                <div>
                  <div style={{fontWeight:700,fontSize:14}}>{pm.icon} {pm.label}</div>
                  <div style={{fontSize:12,color:'var(--text-muted)',marginTop:2}}>{pm.desc}</div>
                  {pm.value==='transfer' && form.paymentMethod==='transfer' && (
                    <div style={{marginTop:6,padding:'8px 12px',background:'rgba(234,179,8,0.1)',borderRadius:6,fontSize:12,color:'var(--gold)',fontWeight:600}}>
                      ⚠️ Tato možnost je dostupná pouze pro zákazníky se smluvním vztahem s FIMAS s.r.o.
                    </div>
                  )}
                </div>
              </label>
            ))}
          </div>
        </div>

        <div className="form-section">
          <h3>Poznámka k objednávce</h3>
          <div className="form-field full">
            <textarea value={form.note} onChange={e=>handleChange('note',e.target.value)} placeholder="Zde můžete uvést jakékoliv poznámky k objednávce..." />
          </div>
        </div>

        <div className="order-summary-compact">
          <h4>Shrnutí objednávky</h4>
          {cart.map(item => (
            <div key={item.id} className="item">
              <span>{item.qty}× {item.name} ({item.code})</span>
              <strong>{fmtPrice(item.price * item.qty)}</strong>
            </div>
          ))}
          <div className="item" style={{borderTop:'1px solid var(--border)',paddingTop:8,marginTop:8}}>
            <span>Mezisoučet bez DPH:</span><strong>{fmtPrice(subtotal)}</strong>
          </div>
          <div className="item"><span>DPH 21%:</span><strong>{fmtPrice(vatTotal)}</strong></div>
          <div className="item" style={{fontSize:16,fontWeight:800}}>
            <span>Celkem s DPH:</span><strong>{fmtPrice(total)}</strong>
          </div>
          <div className="item" style={{color:'var(--orange)',fontSize:12,fontWeight:600}}>
            + poštovné a balné (bude upřesněno)
          </div>
          <div className="item" style={{fontSize:13,marginTop:4}}>
            <span>Způsob platby:</span><strong>{PAY_LABELS[form.paymentMethod] || form.paymentMethod}</strong>
          </div>
        </div>

        <div className="form-section" style={{fontSize:13,lineHeight:1.55}}>
          <label className="filter-checkbox" style={{alignItems:'flex-start',fontSize:14}}>
            <input type="checkbox" checked={agree} onChange={e=>setAgree(e.target.checked)} style={{marginTop:3}} required />
            <span>Souhlasím s <a onClick={(e)=>{e.preventDefault();setLegal('terms');}} style={{color:'var(--blue)',textDecoration:'underline',cursor:'pointer'}}>obchodními podmínkami</a> a beru na vědomí <a onClick={(e)=>{e.preventDefault();setLegal('gdpr');}} style={{color:'var(--blue)',textDecoration:'underline',cursor:'pointer'}}>zásady zpracování osobních údajů</a>. <span className="req">*</span></span>
          </label>
          <p style={{margin:'8px 0 0',color:'var(--text-muted)'}}>Jako spotřebitel máte právo odstoupit od smlouvy bez udání důvodu do 14 dnů od převzetí zboží; náklady na vrácení zboží nesete vy. Ceny dopravy nejsou součástí objednávky a budou vám sděleny před expedicí. Potvrzení objednávky s obchodními podmínkami a formulářem pro odstoupení obdržíte e-mailem z adresy {COMPANY.customerEmailFrom}.</p>
        </div>

        {error && <p style={{color:'var(--red)',fontSize:14,marginBottom:12}}>{error}</p>}

        <button type="submit" className="submit-order-btn" disabled={sending}>
          {sending ? 'Odesílám...' : 'Objednat s povinností platby'}
        </button>
        <p style={{fontSize:12,color:'var(--orange)',fontWeight:600,textAlign:'center',marginTop:8}}>Celková cena {fmtPrice(total)} s DPH nezahrnuje poštovné a balné, které bude účtováno dodatečně.</p>
      </form>
      <LegalModal which={legal} onClose={()=>setLegal(null)} />
    </div>
  );
}

/* ===================== AUTH PAGES ===================== */
function LoginPage() {
  const { setPage, setUser, showToast } = useApp();
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');
  const [resetMode, setResetMode] = useState(false);
  const [resetEmail, setResetEmail] = useState('');
  const [resetMsg, setResetMsg] = useState('');

  const [busy, setBusy] = useState(false);

  const handleLogin = async (e) => {
    e.preventDefault();
    setError('');
    const f = getFb();
    if(!f) { setError(FB_UNAVAILABLE); return; }
    const em = email.trim();
    setBusy(true);
    try {
      await f.auth.signInWithEmailAndPassword(em, pass);
      showToast('Přihlášení úspěšné');
      setPage('home');
    } catch(err) {
      // Převod starého účtu uloženého jen v tomto prohlížeči (před spuštěním Firebase)
      let legacy = null;
      try { legacy = JSON.parse(localStorage.getItem('adr_users') || '[]').find(u => String(u.email||'').trim().toLowerCase() === em.toLowerCase() && u.password === pass); } catch {}
      if(legacy && /user-not-found|invalid-credential|invalid-login/.test(err.code || '')) {
        try {
          const cred = await f.auth.createUserWithEmailAndPassword(em, pass);
          const prof = pickProfile(legacy);
          await f.db.collection('users').doc(cred.user.uid).set({ ...prof, email: em.toLowerCase(), createdAt: f.ts(), migratedFromBrowser: true });
          try { await cred.user.updateProfile({ displayName: prof.name }); await cred.user.sendEmailVerification(); } catch {}
          setUser(prev => ({ ...(prev || {}), ...prof, uid: cred.user.uid, email: cred.user.email }));
          showToast('Účet byl převeden – na e-mail jsme poslali odkaz k ověření');
          setPage('home');
        } catch(err2) { setError(fbErr(err2)); }
      } else {
        setError(fbErr(err));
      }
    }
    setBusy(false);
  };

  const handleResetPassword = async (e) => {
    e.preventDefault();
    const f = getFb();
    if(!f) { setResetMsg(FB_UNAVAILABLE); return; }
    try {
      await f.auth.sendPasswordResetEmail(resetEmail.trim());
      setResetMsg('Pokud je e-mail ' + resetEmail.trim() + ' registrován, poslali jsme na něj odkaz pro nastavení nového hesla. Zkontrolujte i složku spam.');
    } catch(err) { setResetMsg(fbErr(err)); }
  };

  if(resetMode) {
    return (
      <div className="auth-page">
        <div className="auth-card">
          <h2>Zapomenuté heslo</h2>
          <p className="sub">Zadejte e-mail pro obnovení hesla</p>
          <form onSubmit={handleResetPassword}>
            <div className="auth-field">
              <label>E-mail</label>
              <input type="email" value={resetEmail} onChange={e=>setResetEmail(e.target.value)} required autoFocus/>
            </div>
            {resetMsg && <p style={{color:resetMsg.startsWith('Pokud') ? 'var(--green)' : 'var(--red)',fontSize:13,marginTop:8}}>{resetMsg}</p>}
            <button className="auth-btn" type="submit">Obnovit heslo</button>
          </form>
          <div className="auth-switch">
            <a onClick={()=>{setResetMode(false);setResetMsg('');}}>← Zpět na přihlášení</a>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="auth-page">
      <div className="auth-card">
        <h2>Přihlášení</h2>
        <p className="sub">Přihlaste se ke svému účtu</p>
        <form onSubmit={handleLogin}>
          <div className="auth-field">
            <label>E-mail</label>
            <input type="email" autoCapitalize="none" autoCorrect="off" autoComplete="email" value={email} onChange={e=>setEmail(e.target.value)} required />
          </div>
          <div className="auth-field">
            <label>Heslo</label>
            <input type="password" autoComplete="current-password" value={pass} onChange={e=>setPass(e.target.value)} required />
          </div>
          {error && <p style={{color:'var(--red)',fontSize:13,marginTop:8}}>{error}</p>}
          <button className="auth-btn" type="submit" disabled={busy}>{busy ? 'Přihlašuji…' : 'Přihlásit se'}</button>
          <div style={{textAlign:'center',marginTop:12}}>
            <a onClick={()=>setResetMode(true)} style={{fontSize:13,color:'var(--blue)',cursor:'pointer'}}>Zapomenuté heslo?</a>
          </div>
        </form>
        <div className="auth-switch">
          Nemáte účet? <a onClick={()=>setPage('register')}>Zaregistrujte se</a>
        </div>
      </div>
    </div>
  );
}

function RegisterPage() {
  const { setPage, setUser, showToast } = useApp();
  const [form, setForm] = useState({ name:'', email:'', phone:'', company:'', ico:'', dic:'', street:'', city:'', zip:'', password:'', password2:'' });
  const [error, setError] = useState('');

  const handleChange = (k,v) => setForm(f => ({...f,[k]:v}));

  const [sending, setSending] = useState(false);

  const handleRegister = async (e) => {
    e.preventDefault();
    setError('');
    if(!form.name || !form.email || !form.password) { setError('Vyplňte povinná pole.'); return; }
    if(form.password !== form.password2) { setError('Hesla se neshodují.'); return; }
    if(form.password.length < 6) { setError('Heslo musí mít alespoň 6 znaků.'); return; }
    const f = getFb();
    if(!f) { setError(FB_UNAVAILABLE); return; }
    setSending(true);
    try {
      const em = form.email.trim();
      const cred = await f.auth.createUserWithEmailAndPassword(em, form.password);
      const prof = pickProfile(form);
      await f.db.collection('users').doc(cred.user.uid).set({ ...prof, email: em.toLowerCase(), createdAt: f.ts(), privacyNoticeAccepted: LEGAL_VERSION });
      try { await cred.user.updateProfile({ displayName: prof.name }); } catch {}
      try { await cred.user.sendEmailVerification(); } catch(err) { console.warn('Ověřovací e-mail:', err); }
      try { await sendRegistrationEmail({ ...prof, email: em }); } catch {}
      setUser(prev => ({ ...(prev || {}), ...prof, uid: cred.user.uid, email: cred.user.email, emailVerified: false }));
      showToast('Registrace úspěšná – na e-mail jsme poslali odkaz k ověření adresy');
      setPage('home');
    } catch(err) {
      setError(fbErr(err));
    }
    setSending(false);
  };

  return (
    <div className="auth-page" style={{maxWidth:520}}>
      <div className="auth-card">
        <h2>Registrace</h2>
        <p className="sub">Vytvořte si účet pro rychlejší objednávání</p>
        <form onSubmit={handleRegister}>
          <div className="auth-field"><label>Jméno a příjmení *</label><input value={form.name} onChange={e=>handleChange('name',e.target.value)} required/></div>
          <div className="auth-field"><label>E-mail *</label><input type="email" autoCapitalize="none" autoCorrect="off" autoComplete="email" value={form.email} onChange={e=>handleChange('email',e.target.value)} required/></div>
          <div className="auth-field"><label>Telefon</label><input type="tel" value={form.phone} onChange={e=>handleChange('phone',e.target.value)}/></div>
          <div className="auth-field"><label>Firma</label><input value={form.company} onChange={e=>handleChange('company',e.target.value)}/></div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div className="auth-field"><label>IČO</label><input value={form.ico} onChange={e=>handleChange('ico',e.target.value)}/></div>
            <div className="auth-field"><label>DIČ</label><input value={form.dic} onChange={e=>handleChange('dic',e.target.value)}/></div>
          </div>

function AccountPage() {
  const { user, setUser, setPage, addToCart, favorites, products, showToast } = useApp();
  const [tab, setTab] = useState('profile');
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState({});
  const [pwForm, setPwForm] = useState({current:'',newPw:'',newPw2:''});
  const [pwError, setPwError] = useState('');
  const [orderDetail, setOrderDetail] = useState(null);

  const [remoteOrders, setRemoteOrders] = useState([]);
  useEffect(() => {
    const f = getFb();
    if(!f || !user || !user.uid) return;
    f.db.collection('orders').where('uid', '==', user.uid).get()
      .then(qs => setRemoteOrders(qs.docs.map(d => d.data())))
      .catch(e => console.warn('[ADR E-shop] Objednávky se nenačetly:', fbErr(e)));
  }, [user && user.uid]);
  const orders = useMemo(() => {
    let local = []; try { local = JSON.parse(localStorage.getItem('adr_orders') || '[]'); } catch {}
    const map = new Map();
    [...local, ...remoteOrders].forEach(o => { if(o && o.id) map.set(o.id, { ...(map.get(o.id) || {}), ...o }); });
    return [...map.values()].sort((a, b) => String(a.termsAccepted || a.id).localeCompare(String(b.termsAccepted || b.id)));
  }, [remoteOrders]);
  useEffect(() => { if(!user) setPage('login'); }, [user]);
  if(!user) return null;

  const startEdit = () => { setForm({name:user.name||'',email:user.email||'',phone:user.phone||'',company:user.company||'',ico:user.ico||'',dic:user.dic||'',street:user.street||'',city:user.city||'',zip:user.zip||''}); setEditing(true); };
  const handleChange = (k,v) => setForm(f=>({...f,[k]:v}));

  const saveProfile = async (e) => {
    e.preventDefault();
    const prof = pickProfile(form);
    const f = getFb();
    if(f && user.uid) {
      try { await f.db.collection('users').doc(user.uid).set({ ...prof, updatedAt: f.ts() }, { merge: true }); }
      catch(err) { showToast(fbErr(err)); return; }
    }
    setUser({ ...user, ...prof });
    setEditing(false);
    showToast('Profil byl uložen');
  };

  const changePassword = async (e) => {
    e.preventDefault();
    setPwError('');
    if(pwForm.newPw.length < 6) { setPwError('Nové heslo musí mít alespoň 6 znaků.'); return; }
    if(pwForm.newPw !== pwForm.newPw2) { setPwError('Nová hesla se neshodují.'); return; }
    const f = getFb();
    const cu = f && f.auth.currentUser;
    if(!cu) { setPwError(FB_UNAVAILABLE); return; }
    try {
      await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email, pwForm.current));
      await cu.updatePassword(pwForm.newPw);
      setPwForm({current:'',newPw:'',newPw2:''});
      showToast('Heslo bylo změněno');
    } catch(err) {
      setPwError(/wrong-password|invalid-credential|invalid-login/.test(err.code || '') ? 'Současné heslo není správné.' : fbErr(err));
    }
  };

  const logout = async () => {
    const f = getFb();
    try { if(f) await f.auth.signOut(); } catch {}
    setUser(null); showToast('Odhlášeno'); setPage('home');
  };

  const resendVerification = async () => {
    const f = getFb(); const cu = f && f.auth.currentUser;
    if(!cu) return;
    try { await cu.sendEmailVerification(); showToast('Ověřovací e-mail byl odeslán'); } catch(err) { showToast(fbErr(err)); }
  };

  const repeatOrder = (order) => {
    if(!order.items) return;
    order.items.forEach(item => {
      addToCart({id:item.id,code:item.code,name:item.name,subtitle:item.subtitle||'',price:item.price,image:item.image||'',url:item.url||''}, item.qty);
    });
    showToast('Položky z objednávky přidány do košíku');
    setPage('cart');
  };

  const viewOrderHTML = (order) => {
    const payLabels = PAY_LABELS;
    const htmlOrder = buildOrderHTML(order.id||order.orderNumber, order.date, order.form||{name:order.customer?.name||'',email:order.customer?.email||'',phone:order.customer?.phone||'',company:order.customer?.company||'',ico:order.customer?.ico||'',dic:order.customer?.dic||'',street:order.customer?.street||'',city:order.customer?.city||'',zip:order.customer?.zip||'',note:'',paymentMethod:order.paymentMethod||'transfer'}, order.items||[], order.subtotal||0, order.vatTotal||0, order.total||0, payLabels);
    const w = window.open('','_blank');
    if(w) { w.document.write(htmlOrder); w.document.close(); }
  };

  const favProducts = products.filter(p => favorites.includes(p.id));

  return (
    <div className="info-page" style={{maxWidth:800}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{margin:0}}>Můj účet</h2>
        <button onClick={logout} style={{padding:'8px 16px',background:'var(--red)',color:'#fff',border:'none',borderRadius:8,fontSize:13,fontWeight:600,cursor:'pointer'}}>Odhlásit se</button>
      </div>
      {user.uid && user.emailVerified === false && (
        <div className="shipping-notice" style={{marginBottom:16}}>
          <span className="warn-icon">✉️</span>
          <div><p>Váš e-mail <strong>{user.email}</strong> zatím není ověřený. Klikněte na odkaz v e-mailu, který jsme vám poslali (zkontrolujte i spam), a stránku obnovte.</p>
          <button className="page-btn" onClick={resendVerification} style={{marginTop:6}}>Poslat ověřovací e-mail znovu</button></div>
        </div>
      )}
      {user.isAdmin && <p style={{marginBottom:16}}><a onClick={()=>setPage('admin')} style={{color:'var(--blue)',fontWeight:700,cursor:'pointer'}}>⚙ Přejít do admin panelu →</a></p>}
      <div style={{display:'flex',gap:8,marginBottom:24,flexWrap:'wrap'}}>
        {['profile','orders','favorites'].map(t => (
          <button key={t} className={`page-btn${tab===t?' active':''}`} onClick={()=>setTab(t)}>
            {t==='profile'?'👤 Profil':t==='orders'?`📦 Objednávky (${orders.length})`:`❤️ Oblíbené (${favProducts.length})`}
          </button>
        ))}
      </div>

      {tab === 'profile' && !editing && (
        <div className="form-section">
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
            <h3 style={{margin:0}}>Osobní údaje</h3>
            <button onClick={startEdit} className="page-btn">✏️ Upravit</button>
          </div>
          <table><tbody>
            <tr><td style={{fontWeight:600,width:'30%',padding:'6px 0'}}>Jméno</td><td>{user.name}</td></tr>
            <tr><td style={{fontWeight:600,padding:'6px 0'}}>E-mail</td><td>{user.email}</td></tr>
            {user.phone && <tr><td style={{fontWeight:600,padding:'6px 0'}}>Telefon</td><td>{user.phone}</td></tr>}
            {user.company && <tr><td style={{fontWeight:600,padding:'6px 0'}}>Firma</td><td>{user.company}</td></tr>}
            {user.ico && <tr><td style={{fontWeight:600,padding:'6px 0'}}>IČO</td><td>{user.ico}</td></tr>}
            {user.dic && <tr><td style={{fontWeight:600,padding:'6px 0'}}>DIČ</td><td>{user.dic}</td></tr>}
            {user.street && <tr><td style={{fontWeight:600,padding:'6px 0'}}>Adresa</td><td>{user.street}, {user.city} {user.zip}</td></tr>}
          </tbody></table>

          <h3 style={{marginTop:24}}>Změna hesla</h3>
          <form onSubmit={changePassword} style={{maxWidth:380}}>
            <div className="auth-field"><label>Současné heslo</label><input type="password" value={pwForm.current} onChange={e=>setPwForm(f=>({...f,current:e.target.value}))} required/></div>
            <div className="auth-field"><label>Nové heslo</label><input type="password" value={pwForm.newPw} onChange={e=>setPwForm(f=>({...f,newPw:e.target.value}))} required/></div>
            <div className="auth-field"><label>Nové heslo znovu</label><input type="password" value={pwForm.newPw2} onChange={e=>setPwForm(f=>({...f,newPw2:e.target.value}))} required/></div>
            {pwError && <p style={{color:'var(--red)',fontSize:13}}>{pwError}</p>}
            <button className="page-btn active" type="submit" style={{marginTop:8}}>Změnit heslo</button>
          </form>
        </div>
      )}

      {tab === 'profile' && editing && (
        <div className="form-section">
          <h3>Upravit profil</h3>
          <form onSubmit={saveProfile}>
            <div className="auth-field"><label>Jméno a příjmení *</label><input value={form.name} onChange={e=>handleChange('name',e.target.value)} required/></div>
            <div className="auth-field"><label>E-mail</label><input type="email" value={form.email} disabled style={{opacity:0.5}}/></div>
            <div className="auth-field"><label>Telefon</label><input type="tel" value={form.phone} onChange={e=>handleChange('phone',e.target.value)}/></div>
            <div className="auth-field"><label>Firma</label><input value={form.company} onChange={e=>handleChange('company',e.target.value)}/></div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
              <div className="auth-field"><label>IČO</label><input value={form.ico} onChange={e=>handleChange('ico',e.target.value)}/></div>
              <div className="auth-field"><label>DIČ</label><input value={form.dic} onChange={e=>handleChange('dic',e.target.value)}/></div>
            </div>
            <div className="auth-field"><label>Ulice a číslo</label><input value={form.street} onChange={e=>handleChange('street',e.target.value)}/></div>
            <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:12}}>
              <div className="auth-field"><label>Město</label><input value={form.city} onChange={e=>handleChange('city',e.target.value)}/></div>
              <div className="auth-field"><label>PSČ</label><input value={form.zip} onChange={e=>handleChange('zip',e.target.value)}/></div>
            </div>
            <div style={{display:'flex',gap:8,marginTop:16}}>
              <button className="page-btn active" type="submit">Uložit změny</button>
              <button className="page-btn" type="button" onClick={()=>setEditing(false)}>Zrušit</button>
            </div>
          </form>
        </div>
      )}

      {tab === 'orders' && (
        <div>
          {orders.length === 0 ? (
            <p style={{color:'var(--text-muted)',textAlign:'center',padding:32}}>Zatím žádné objednávky.</p>
          ) : (

              <div key={i} className="form-section" style={{marginBottom:12}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:8}}>
                  <div>
                    <strong style={{fontSize:15}}>{o.id || o.orderNumber || `Objednávka ${i+1}`}</strong>
                    <span style={{color:'var(--text-muted)',fontSize:13,marginLeft:12}}>{o.date}</span>
                  </div>
                  <div style={{display:'flex',gap:6}}>
                    <button className="page-btn" onClick={()=>viewOrderHTML(o)} title="Zobrazit detail">📄 Detail</button>
                    <button className="page-btn" onClick={()=>repeatOrder(o)} title="Opakovat objednávku">🔄 Opakovat</button>
                  </div>
                </div>
                <div style={{fontSize:13,color:'var(--text-mid)',marginTop:8}}>
                  {(o.items||[]).map((item,j) => (
                    <div key={j} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',borderBottom:'1px solid var(--border)'}}>

function TermsContent({inModal}) {

      <p>Tyto všeobecné obchodní podmínky (dále jen „VOP“) upravují vzájemná práva a povinnosti mezi prodávajícím a kupujícím při prodeji zboží prostřednictvím internetového obchodu {COMPANY.url} (dále jen „e-shop“).</p>

      Kontakt: tel. {COMPANY.phone}, mobil / WhatsApp {COMPANY.mobile}, e-mail {COMPANY.email}, objednávky adr@fimas.cz. Provozní doba: {COMPANY.hours}.<br/>

      <p>Dozorovým orgánem je Česká obchodní inspekce (www.coi.cz). Kupujícím může být spotřebitel i podnikatel. Ustanovení, která jsou výslovně určena spotřebitelům (zejména odstoupení od smlouvy bez udání důvodu), se na kupujícího – podnikatele nevztahují; vztahy s podnikateli se řídí zákonem č. 89/2012 Sb., občanským zákoníkem (dále jen „OZ“), v rozsahu neupraveném těmito VOP.</p>

      <h3>2. Uživatelský účet</h3>
      <p>Kupující může nakupovat bez registrace nebo si zřídit uživatelský účet. Při registraci je povinen uvádět pravdivé údaje a chránit své přihlašovací údaje. Prodávající může účet zrušit, pokud jej kupující nepoužívá nebo porušuje tyto VOP.</p>

      <h3>3. Objednávka a uzavření kupní smlouvy</h3>
      <p>Prezentace zboží v e-shopu má informativní charakter a není návrhem na uzavření smlouvy. Objednávku lze učinit prostřednictvím e-shopu, e-mailem na {COMPANY.email}, telefonicky na {COMPANY.phone} nebo přes WhatsApp na {COMPANY.mobile}. Minimální hodnota objednávky není stanovena.</p>
      <p>Před odesláním objednávky si kupující může zkontrolovat a měnit zadané údaje. Objednávku odešle tlačítkem <strong>„Objednat s povinností platby“</strong>. Přijetí objednávky prodávající potvrdí e-mailem na adresu uvedenou kupujícím; kupní smlouva je uzavřena okamžikem doručení potvrzení objednávky (akceptace) kupujícímu. Součástí potvrzení jsou tyto VOP a formulář pro odstoupení od smlouvy.</p>

      <p>Spotřebitel je povinen zboží vrátit nejpozději do 14 dnů od odstoupení na adresu prodávajícího, nepoškozené a pokud možno v původním obalu. <strong>Přímé náklady na vrácení zboží nese spotřebitel.</strong> Zboží nelze zaslat na dobírku. Spotřebitel odpovídá za snížení hodnoty zboží vzniklé nakládáním se zbožím jinak, než je nutné k seznámení se s jeho povahou a funkčností (např. montáží).</p>
      <p>Prodávající vrátí spotřebiteli do 14 dnů od odstoupení všechny přijaté peněžní prostředky včetně nákladů na dodání (ve výši nejlevnějšího nabízeného způsobu dopravy), a to stejným způsobem, jakým je přijal, nebo jiným způsobem, se kterým spotřebitel souhlasí. Prodávající není povinen platbu vrátit dříve, než mu je zboží předáno nebo spotřebitel prokáže jeho odeslání.</p>
      <p>Od smlouvy nelze odstoupit u zboží vyrobeného nebo upraveného podle přání spotřebitele (např. zakázková výroba, díly krácené či upravené na míru) – § 1837 OZ. Kupující – podnikatel nemá zákonné právo odstoupit od smlouvy bez udání důvodu; vrácení zboží je možné pouze po předchozí dohodě s prodávajícím.</p>

      <p>Spotřebitel má podle povahy vady právo na opravu nebo výměnu zboží, případně na přiměřenou slevu nebo odstoupení od smlouvy (§ 2169 a násl. OZ). Při oprávněné reklamaci má kupující právo na náhradu účelně vynaložených nákladů (např. poštovného). Odpovědnost za vady se nevztahuje na běžné opotřebení, vady vzniklé neodbornou montáží, nevhodným užíváním či nešetrným zacházením, ani na vady, pro které byla sjednána nižší cena.</p>

function WithdrawalPage() {
  const { user, showToast } = useApp();
  const pastOrders = useMemo(() => { try { return JSON.parse(localStorage.getItem('adr_orders') || '[]').slice().reverse(); } catch { return []; } }, []);
  const [d, setD] = useState({
    orderNumber:'', orderDate:'', receivedDate:'', items:'',
    name: user?.name || '', address: user ? [user.street, [user.zip, user.city].filter(Boolean).join(' ')].filter(Boolean).join(', ') : '',
    email: user?.email || '', phone: user?.phone || '', account:'', reason:'', confirm:false,
  });
  const [sending, setSending] = useState(false);
  const [done, setDone] = useState(null);
  const [error, setError] = useState('');
  const set = (k, v) => setD(x => ({...x, [k]: v}));

  const pickOrder = (id) => {
    const o = pastOrders.find(x => x.id === id);
    if(!o) { set('orderNumber', id); return; }
    const f = o.form || {};
    setD(x => ({...x,
      orderNumber: o.id, orderDate: o.date || '',
      items: (o.items||[]).map(i => `${i.name}${i.code ? ' ('+i.code+')' : ''} – ${i.qty} ks`).join('\n'),
      name: f.name || x.name, email: f.email || x.email, phone: f.phone || x.phone,
      address: [f.street, [f.zip, f.city].filter(Boolean).join(' ')].filter(Boolean).join(', ') || x.address,
    }));
  };

  const submit = async (e) => {
    e.preventDefault();
    if(!d.orderNumber || !d.receivedDate || !d.items || !d.name || !d.address || !d.email || !d.confirm) {
      setError('Vyplňte prosím všechna povinná pole a potvrďte odstoupení.'); return;
    }
    setError(''); setSending(true);
    const submittedAt = new Date().toLocaleString('cs-CZ');
    const html = buildWithdrawalHTML({...d, submittedAt});
    let ok = false;
    try {
      const resp = await fetch(EMAIL_FUNCTION_URL, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          type:'withdrawal', html, customerHtml: html,
          customerEmail: d.email, customerName: d.name, orderNumber: d.orderNumber,
          subject: `Odstoupení od smlouvy – objednávka ${d.orderNumber}`,
        })
      });
      const r = await resp.json(); ok = !!r.success;
    } catch(err) { console.warn('Withdrawal email failed', err); }
    if(!ok) {
      const body = [`ODSTOUPENÍ OD KUPNÍ SMLOUVY`, ``, `Objednávka: ${d.orderNumber}`, `Datum objednání: ${d.orderDate}`, `Datum převzetí: ${d.receivedDate}`, ``, `Vracené zboží:`, d.items, ``,
        `Jméno: ${d.name}`, `Adresa: ${d.address}`, `E-mail: ${d.email}`, `Telefon: ${d.phone}`, `Účet pro vrácení peněz: ${d.account}`, d.reason ? `Důvod: ${d.reason}` : '', ``, `Datum: ${submittedAt}`].filter(x => x !== null).join('\n');
      window.location.href = `mailto:${COMPANY.email}?cc=${ORDER_EMAIL}&subject=${encodeURIComponent('Odstoupení od smlouvy – ' + d.orderNumber)}&body=${encodeURIComponent(body)}`;
    }
    try {
      const list = JSON.parse(localStorage.getItem('adr_withdrawals') || '[]');
      list.push({...d, submittedAt}); localStorage.setItem('adr_withdrawals', JSON.stringify(list));
    } catch {}
    fbSaveDoc('withdrawals', (d.orderNumber || 'X') + '-' + Date.now(), { ...d, submittedAt });
    setSending(false);
    setDone({ok, html});
    showToast && showToast(ok ? 'Odstoupení bylo odesláno' : 'Otevřen e-mail s odstoupením – odešlete jej');
  };

  const openPrintable = (html) => { const w = window.open('', '_blank'); if(w) { w.document.write(html); w.document.close(); } };

  if(done) return (
    <div className="info-page">
      <h2>Odstoupení od smlouvy</h2>
      <div className="form-section" style={{borderColor:'var(--green)'}}>
        <h3 style={{color:'var(--green)'}}>✓ {done.ok ? 'Odstoupení jsme přijali' : 'Odstoupení připraveno k odeslání'}</h3>
        {done.ok
          ? <p>Oznámení o odstoupení bylo odesláno prodávajícímu a jeho kopie na váš e-mail <strong>{d.email}</strong>. Přijetí vám potvrdíme.</p>
          : <p>Automatické odeslání se nezdařilo, proto jsme otevřeli váš e-mailový program s vyplněným oznámením. <strong>Nezapomeňte e-mail odeslat.</strong> Případně nás kontaktujte na {COMPANY.email} nebo {COMPANY.phone}.</p>}
        <p><strong>Další postup:</strong> zboží zašlete nejpozději do 14 dnů na adresu {COMPANY.name}, {COMPANY.address} (ne na dobírku), ideálně s kopií faktury a vytištěným formulářem. Peníze vrátíme do 14 dnů od odstoupení, nejdříve však po převzetí zboží nebo prokázání jeho odeslání.</p>
        <button className="page-btn active" onClick={()=>openPrintable(done.html)}>🖨️ Vytisknout formulář</button>
      </div>
    </div>
  );

  const inp = {width:'100%'};
  return (
    <div className="info-page">
      <h2>Odstoupení od smlouvy</h2>
      <p>Jako spotřebitel máte právo odstoupit od kupní smlouvy <strong>bez udání důvodu do 14 dnů od převzetí zboží</strong> (§ 1829 občanského zákoníku). Stačí vyplnit a odeslat tento formulář – kopii obdržíte e-mailem. Odstoupení můžete zaslat i e-mailem na {COMPANY.email} nebo poštou na {COMPANY.address}, např. na <a onClick={()=>openPrintable(buildWithdrawalHTML({}))} style={{color:'var(--blue)',cursor:'pointer',textDecoration:'underline'}}>vytištěném vzorovém formuláři</a>.</p>
      <div className="shipping-notice" style={{marginBottom:20}}>
        <span className="warn-icon">ℹ️</span>
        <div>
          <p>Náklady na vrácení zboží nese kupující. Zboží nezasílejte na dobírku. Od smlouvy nelze odstoupit u zboží upraveného na přání zákazníka. Kupující – podnikatel (nákup na IČO) zákonné právo na odstoupení nemá; vrácení je možné po dohodě.</p>
        </div>
      </div>

      <form onSubmit={submit}>
        <div className="form-section">
          <h3>Objednávka</h3>
          {pastOrders.length > 0 && (
            <div className="form-field" style={{marginBottom:12}}>
              <label>Vyberte objednávku z historie</label>
              <select className="filter-select" value={pastOrders.some(o=>o.id===d.orderNumber) ? d.orderNumber : ''} onChange={e=>pickOrder(e.target.value)}>
                <option value="">— zadám ručně —</option>
                {pastOrders.map(o => <option key={o.id} value={o.id}>{o.id} · {o.date} · {fmtPrice(o.total)}</option>)}
              </select>
            </div>
          )}
          <div className="form-row">
            <div className="form-field"><label>Číslo objednávky / faktury <span className="req">*</span></label><input style={inp} value={d.orderNumber} onChange={e=>set('orderNumber',e.target.value)} required/></div>
            <div className="form-field"><label>Datum objednání</label><input style={inp} value={d.orderDate} onChange={e=>set('orderDate',e.target.value)} placeholder="např. 20. 11. 2026"/></div>
            <div className="form-field"><label>Datum převzetí zboží <span className="req">*</span></label><input type="date" style={inp} value={d.receivedDate} onChange={e=>set('receivedDate',e.target.value)} required/></div>
          </div>
          <div className="form-field"><label>Vracené zboží – název, kód, počet kusů <span className="req">*</span></label><textarea rows={4} style={inp} value={d.items} onChange={e=>set('items',e.target.value)} required/></div>
        </div>
        <div className="form-section">
          <h3>Kupující</h3>
          <div className="form-row">
            <div className="form-field"><label>Jméno a příjmení <span className="req">*</span></label><input style={inp} value={d.name} onChange={e=>set('name',e.target.value)} required/></div>
            <div className="form-field"><label>E-mail <span className="req">*</span></label><input type="email" style={inp} value={d.email} onChange={e=>set('email',e.target.value)} required/></div>
            <div className="form-field"><label>Telefon</label><input style={inp} value={d.phone} onChange={e=>set('phone',e.target.value)}/></div>
          </div>
          <div className="form-field"><label>Adresa <span className="req">*</span></label><input style={inp} value={d.address} onChange={e=>set('address',e.target.value)} required/></div>
          <div className="form-row">
            <div className="form-field"><label>Číslo účtu pro vrácení peněz</label><input style={inp} value={d.account} onChange={e=>set('account',e.target.value)} placeholder="u platby dobírkou / převodem"/></div>
            <div className="form-field"><label>Důvod odstoupení (nepovinné)</label><input style={inp} value={d.reason} onChange={e=>set('reason',e.target.value)}/></div>
          </div>
        </div>
        <label className="filter-checkbox" style={{marginBottom:12,alignItems:'flex-start'}}>
          <input type="checkbox" checked={d.confirm} onChange={e=>set('confirm',e.target.checked)} style={{marginTop:3}}/>
          <span>Oznamuji, že tímto odstupuji od kupní smlouvy o nákupu výše uvedeného zboží. <span className="req">*</span></span>
        </label>
        {error && <p style={{color:'var(--red)',fontSize:14,marginBottom:12}}>{error}</p>}
        <button type="submit" className="submit-order-btn" disabled={sending}>{sending ? 'Odesílám...' : 'Odeslat odstoupení od smlouvy'}</button>
      </form>
    </div>
  );
}

/* Překryvné okno s právním textem (v pokladně – formulář zůstane vyplněný) */
function LegalModal({which, onClose}) {
  useEffect(() => {
    const k = (e) => { if(e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
  }, [onClose]);
  if(!which) return null;
  return (
    <div onClick={onClose} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.55)',zIndex:2000,display:'flex',alignItems:'center',justifyContent:'center',padding:16}}>
      <div onClick={e=>e.stopPropagation()} className="info-page" style={{background:'#fff',color:'#111',maxWidth:820,width:'100%',maxHeight:'88vh',overflowY:'auto',borderRadius:12,padding:'20px 24px',margin:0,position:'relative'}}>
        <button onClick={onClose} aria-label="Zavřít" style={{position:'sticky',top:0,float:'right',background:'var(--navy)',color:'#fff',border:'none',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontWeight:700}}>✕ Zavřít</button>
        {which === 'terms' ? <TermsContent inModal/> : <GdprContent/>}
      </div>
    </div>
  );
}

/* Cookie lišta – nezbytné vždy, chat (tawk.to) jen se souhlasem */
const COOKIE_KEY = 'adr_cookie_consent';
function getCookieConsent() { try { return JSON.parse(localStorage.getItem(COOKIE_KEY) || 'null'); } catch { return null; } }
function openCookieSettings() { window.dispatchEvent(new Event('adr-open-cookies')); }

function CookieBar() {
  const { setPage } = useApp();
  const [open, setOpen] = useState(() => !getCookieConsent());
  const [chat, setChat] = useState(() => !!(getCookieConsent() || {}).chat);
  useEffect(() => {
    const h = () => { setChat(!!(getCookieConsent() || {}).chat); setOpen(true); };
    window.addEventListener('adr-open-cookies', h); return () => window.removeEventListener('adr-open-cookies', h);
  }, []);
  const save = (chatOk) => {
    const prev = getCookieConsent();
    try { localStorage.setItem(COOKIE_KEY, JSON.stringify({chat: chatOk, date: new Date().toISOString()})); } catch {}
    window.dispatchEvent(new Event('adr-consent'));
    setOpen(false);
    if(prev && prev.chat && !chatOk && window.Tawk_API && window.Tawk_API.hideWidget) { try { window.Tawk_API.hideWidget(); } catch {} }
  };
  if(!open) return null;
  return (
    <div role="dialog" aria-label="Nastavení cookies" style={{position:'fixed',left:16,right:16,bottom:16,maxWidth:560,margin:'0 auto',background:'#fff',color:'#111',borderRadius:12,boxShadow:'0 8px 32px rgba(0,0,0,0.35)',padding:'16px 18px',zIndex:1500,fontSize:13,lineHeight:1.5}}>
      <strong style={{fontSize:15}}>🍪 Cookies a soukromí</strong>
      <p style={{margin:'6px 0 10px'}}>Nezbytné technické údaje (košík, přihlášení) ukládáme ve vašem prohlížeči vždy. Online chat <strong>tawk.to</strong> ukládá cookies, proto se spustí až s vaším souhlasem (nebo kliknutím na tlačítko „Chat“). Statistické ani reklamní cookies nepoužíváme. Více v <a onClick={()=>{setPage('gdpr');window.scrollTo(0,0);}} style={{color:'var(--blue)',cursor:'pointer',textDecoration:'underline'}}>zásadách ochrany osobních údajů</a>.</p>
      <label style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,opacity:0.7}}><input type="checkbox" checked disabled/> Nezbytné (vždy aktivní)</label>
      <label style={{display:'flex',gap:8,alignItems:'center',marginBottom:12,cursor:'pointer'}}><input type="checkbox" checked={chat} onChange={e=>setChat(e.target.checked)}/> Funkční – online chat (tawk.to)</label>
      <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
        <button onClick={()=>save(true)} style={{flex:'1 1 140px',padding:'10px 14px',background:'var(--blue)',color:'#fff',border:'none',borderRadius:8,fontWeight:700,cursor:'pointer'}}>Přijmout vše</button>
        <button onClick={()=>save(chat)} style={{flex:'1 1 140px',padding:'10px 14px',background:'#eef2f7',color:'#111',border:'1px solid #cbd5e1',borderRadius:8,fontWeight:600,cursor:'pointer'}}>Uložit výběr</button>
        <button onClick={()=>save(false)} style={{flex:'1 1 140px',padding:'10px 14px',background:'#eef2f7',color:'#111',border:'1px solid #cbd5e1',borderRadius:8,fontWeight:600,cursor:'pointer'}}>Pouze nezbytné</button>
      </div>
    </div>
  );
}

/* ===================== NABÍDKY (admin) =====================
   Firestore "offers/{číslo}" – čte i zapisuje jen admin (firestore.rules).
   Číslo: FIMAS + DDMMYYYY (další nabídka téhož dne -2, -3 …). Částky zaokrouhleny na celé Kč. */
const OFFER_STATUSES = {
  draft:    { label:'Rozpracovaná', color:'#64748b' },
  sent:     { label:'Odeslaná',     color:'#2563eb' },
  accepted: { label:'Odsouhlasená', color:'#16a34a' },
  ordered:  { label:'Objednáno',    color:'#7c3aed' },
  rejected: { label:'Zamítnutá',    color:'#dc2626' },
};
const OFFER_CLOSING = 'Platnost nabídky je 2-týdny nebo do vyprodání zásob. Ceny jsou platné pouze pro přesný počet kusů uvedených v nabídce a při vyzvednutí na prodejně. V případě dotazů k nabídce mne neváhejte kontaktovat. Jestliže se rozhodnete objednat nabízené zboží, uveďte prosím do Vaší objednávky číslo naší nabídky a den kdy byla nabídka utvořena.';
const OFFER_SIGNATURE = 'Zpracoval Pavel Juráček, info@fimas.cz';
const OFFER_VALID_DAYS = 14;
const OFFER_CHECKOUT_KEY = 'adr_offer_checkout';
const pad2 = (n) => String(n).padStart(2, '0');
const isoDate = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseIso = (s) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(); };
const czDate = (s) => { const d = parseIso(s); return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear(); };
const offerBaseNumber = (s) => { const d = parseIso(s); return 'FIMAS' + pad2(d.getDate()) + pad2(d.getMonth() + 1) + d.getFullYear(); };
function nextOfferNumber(existingIds, dateIso) {
  const base = offerBaseNumber(dateIso), set = new Set(existingIds);
  if(!set.has(base)) return base;
  let i = 2; while(set.has(base + '-' + i)) i++;
  return base + '-' + i;
}
const offerValidUntil = (dateIso) => { const d = parseIso(dateIso); d.setDate(d.getDate() + OFFER_VALID_DAYS); return isoDate(d); };
const offNorm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const offEsc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const offInt = (v) => { const n = Math.round(Number(String(v).replace(',', '.'))); return isFinite(n) && n > 0 ? n : 0; };
function offerTotals(items) {
  const lines = (items || []).map(i => Math.round((Number(i.price) || 0) * (Number(i.qty) || 0)));
  const subtotal = lines.reduce((s, x) => s + x, 0);
  const vatTotal = Math.round(subtotal * COMPANY.vatRate);
  return { lines, subtotal, vatTotal, total: subtotal + vatTotal };
}
const offerItemFromProduct = (p, qty) => ({ id: p.id, code: p.code || '', name: p.name || '', subtitle: p.subtitle || '', url: p.url || '', image: p.image || '', qty: qty || 1, price: Math.round(Number(p.price) || 0), eshopPrice: Number(p.price) || 0 });

/* Díly k číslu nápravy – stejná logika jako „Identifikace nápravy“ (TYP NÁPRAVY + TYP BRZDY + počet otvorů z P.C.D.) */
function axlePartsFor(input, products) {
  const code = String(input || '').trim().toUpperCase();
  const a = code ? findAxleCode(code) : null;
  if(!a) return { error: 'Číslo nápravy nebylo rozpoznáno.' };
  if(a.serialNumber || !a.code) return { error: 'Výrobní číslo (12 číslic) neobsahuje typ nápravy – zadejte typové číslo nápravy, např. A70NA6INNO36.' };
  const idx = TYPE_INDEX, axle = a.code, brakeCode = a.brakeCode || null, holes = holesFromPcd(a.pcdFromCode || null);
  const byDn = new Map();
  (products || []).forEach(p => { const d = productDnum(p); if(d && !byDn.has(d)) byDn.set(d, p); });
  const toProducts = (dnums) => { const out = [], seen = new Set(); dnums.forEach(d => { const p = byDn.get(d); if(p && !seen.has(p.id)) { seen.add(p.id); out.push(p); } }); return out; };
  const axleEntry = idx.axles.get(axle) || null;
  let brakeEntries = [];
  if(brakeCode) {
    brakeEntries = idx.brakes.filter(b => b.codes.includes(brakeCode));
    const narrowed = brakeEntries.filter(b => b.axles.includes(axle));
    if(narrowed.length) brakeEntries = narrowed;
  } else {
    brakeEntries = idx.brakes.filter(b => b.axles.includes(axle));
    if(!brakeEntries.length) brakeEntries = idx.brakes.filter(b => b.codes.includes(axle));
    if(!brakeEntries.length) { const dims = AXLE_TYPES[axle] || []; brakeEntries = idx.brakes.filter(b => dims.includes(b.dim)); }
  }
  const holeOk = (p) => { if(!holes) return true; const h = holeCount(p.name); return h === null || h === holes; };
  const catOrder = (p) => { const i = CATEGORIES.findIndex(c => c.id === p.categorySlug); return i < 0 ? 999 : i; };
  const sortParts = (arr) => arr.slice().sort((x, y) => (catOrder(x) - catOrder(y)) || x.name.localeCompare(y.name, 'cs'));
  const axleAll = axleEntry ? toProducts(axleEntry.dnums) : [];
  const brakeAll = toProducts(brakeEntries.flatMap(b => b.dnums)).filter(p => !axleAll.some(x => x.id === p.id));
  return {
    axle, brakeCode, holes, ready: idx.ready,
    axleLabel: axleEntry ? axleEntry.label : null,
    brakeLabels: brakeEntries.map(b => b.label),
    axleParts: sortParts(axleAll.filter(holeOk)),
    brakeParts: sortParts(brakeAll.filter(holeOk)),
  };
}

/* Fotky produktů v nabídce: tisk a e-mail berou fotku přímo z obchod.fimas.cz,
   PDF ji potřebuje jako data URI → stáhne se přes adr-email-sender (?img=), protože e-shop neposílá CORS. */
const offerImgOk = (u) => /^https:\/\/obchod\.fimas\.cz\/\S+\.(jpe?g|png|gif|webp)$/i.test(String(u || ''));
async function offerImagesAsData(items) {
  const urls = [...new Set((items || []).map(i => i.image).filter(offerImgOk))];
  const out = {};
  const one = async (u) => {
    try {
      const r = await fetch(EMAIL_FUNCTION_URL + '?img=' + encodeURIComponent(u));
      if(!r.ok) return;
      const blobUrl = URL.createObjectURL(await r.blob());
      try {
        const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = blobUrl; });
        const k = Math.min(1, 200 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out[u] = c.toDataURL('image/jpeg', 0.85);
      } finally { URL.revokeObjectURL(blobUrl); }
    } catch(e) { console.warn('[ADR E-shop] fotka do PDF se nenačetla', u); }
  };
  for(let i = 0; i < urls.length; i += 6) await Promise.all(urls.slice(i, i + 6).map(one));
  return out;
}

/* HTML → PDF (A4) přes html2canvas + jsPDF; vrací instanci jsPDF */
async function htmlToPdf(html) {
  if(typeof html2canvas === 'undefined' || !window.jspdf) throw new Error('Knihovna pro PDF se nenačetla.');
  const iframe = document.createElement('iframe');
  iframe.style.cssText = 'position:fixed;left:-9999px;top:0;width:900px;height:1200px;border:none;';
  document.body.appendChild(iframe);
  try {
    iframe.contentDocument.open(); iframe.contentDocument.write(html.replace(/<script[\s\S]*?<\/script>/gi, '')); iframe.contentDocument.close();
    await Promise.all([...iframe.contentDocument.images].map(im => im.complete ? null : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 8000); })));
    await new Promise(r => setTimeout(r, 300));
    const canvas = await html2canvas(iframe.contentDocument.body, { scale: 2, useCORS: true, allowTaint: false, width: 900, windowWidth: 900, backgroundColor: '#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'mm', 'a4');
    const pdfW = pdf.internal.pageSize.getWidth(), pdfH = pdf.internal.pageSize.getHeight();
    const imgW = pdfW - 20, pageContentH = pdfH - 20;
    const imgH = (canvas.height * imgW) / canvas.width;
    if(imgH <= pageContentH) {
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, imgW, imgH);
    } else {
      const sliceH = Math.floor(canvas.width * pageContentH / imgW);
      for(let srcY = 0; srcY < canvas.height; srcY += sliceH) {
        const h = Math.min(sliceH, canvas.height - srcY);
        const sc = document.createElement('canvas'); sc.width = canvas.width; sc.height = h;
        sc.getContext('2d').drawImage(canvas, 0, srcY, canvas.width, h, 0, 0, canvas.width, h);
        if(srcY > 0) pdf.addPage();
        pdf.addImage(sc.toDataURL('image/jpeg', 0.9), 'JPEG', 10, 10, imgW, (h * imgW) / canvas.width);
      }
    }
    return pdf;
  } finally { document.body.removeChild(iframe); }
}
